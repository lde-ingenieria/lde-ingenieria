cto", "elementos": "Líneas de producto", "numeral": "5.6.2 o)", "frecuencia": "Anual (como mínimo cada año)", "objeto": "Comprobar que el sistema automático de detección de fugas en líneas detecta una fuga simulada y bloquea el suministro por la línea, y que queda el registro en la memoria de la consola.", "ejecutor": "La resolución no restringe quién lo ejecuta; debe hacerse con el manual del fabricante del sistema.", "normativa": [{"ref": "5.6.2 o)", "texto": "Estaciones de Servicio que tengan un sistema automático de detección de fugas en líneas de conducción (LLD) pueden mostrar como evidencia de cumplimiento los resultados almacenados en la memoria del dispositivo, siempre y cuando el sistema cumpla la norma EN 13160 o EPA Continuous Test Certified y su software sea el especificado por el fabricante, y pueda determinar pérdidas por evaporación y fugas de 0,4 litros por hora (0,1 gal/h), con certeza o probabilidad de detección del 95 % y error máximo del 5 %. Como mínimo cada año, se debe simular una fuga en cada línea de la estación; el sistema de control de inventarios debe detectarla y bloquear el suministro de combustible por la línea. Se deberá dejar registro de estas fugas simuladas en la memoria de la consola para una posterior revisión del Organismo de Inspección. La estación deberá contar con un manual para este propósito."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si el sistema detecta la fuga simulada, bloquea el suministro por la línea y registra el evento en la consola.", "params": [], "instrumentos": [], "eval": "lista", "pasos": [{"n": "1", "ref": "5.6.2 o)", "texto": "Confirme que el sistema LLD cumple EN 13160 o EPA Continuous Test Certified y que existe el manual de la prueba.", "borrador": false}, {"n": "2", "ref": "5.6.2 o)", "texto": "Simule una fuga en la línea siguiendo el manual del fabricante.", "borrador": false}, {"n": "3", "ref": "5.6.2 o)", "texto": "Verifique que el sistema detecta la fuga y bloquea el suministro de combustible por la línea.", "borrador": false}, {"n": "4", "ref": "5.6.2 o)", "texto": "Verifique que el registro de la fuga simulada queda en la memoria de la consola.", "borrador": false}, {"n": "5", "ref": "5.6.2 o)", "texto": "Restablezca el sistema a su condición normal y confirme que la línea queda en servicio.", "borrador": false}], "campos": [{"k": "ident", "label": "Línea (producto / tanque)", "tipo": "text", "req": true, "pers": true}, {"k": "cert", "label": "Sistema certificado EN 13160 o EPA Continuous Test", "tipo": "check", "req": true}, {"k": "manual", "label": "La estación cuenta con el manual de la prueba", "tipo": "check", "req": true}, {"k": "simulada", "label": "Se simuló una fuga en la línea", "tipo": "check", "req": true}, {"k": "detecto", "label": "El sistema detectó la fuga", "tipo": "check", "req": true}, {"k": "bloqueo", "label": "El sistema bloqueó el suministro por la línea", "tipo": "check", "req": true}, {"k": "registro", "label": "Registro de la simulación en la memoria de la consola", "tipo": "check", "req": true}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "consola", "label": "Consola con el sistema en prueba", "req": true}, {"k": "alarma", "label": "Alarma o mensaje de fuga detectada", "req": true}, {"k": "bloqueo", "label": "Línea bloqueada", "req": true}, {"k": "registro", "label": "Registro en la memoria de la consola", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general de la consola y del sitio", "req": true}], "accionNC": "La resolución no fija la acción: revisar el sistema con el fabricante, repetir la simulación y, mientras tanto, aplicar las pruebas de hermeticidad de líneas (5.6.2 n)); registrar en la bitácora (5 d).", "notas": ["Pasos auxiliares y parámetros validados por el responsable técnico de TruckServices SAS."]}, {"id": "sensores", "n": 13, "file": "13-prueba-anual-sensores", "prefijo": "PSA", "titulo": "Prueba anual de activación de sensores del sistema automático de detección de fugas", "corto": "Activación de sensores", "resumen": "Activación anual de sensores de pozos, espacio anular y nivel de cajas, con registro en la consola.", "elemento": "Sensor", "elementos": "Sensores", "numeral": "5.6.2 r)", "frecuencia": "Anual (como mínimo cada año)", "objeto": "Comprobar el funcionamiento de cada sensor del sistema automático de detección de fugas y dejar el registro en la memoria de la consola.", "ejecutor": "La resolución no restringe quién lo ejecuta; debe hacerse con el manual del sistema.", "normativa": [{"ref": "5.6.2 r)", "texto": "Las Estaciones de Servicio que tengan un sistema automático de detección de fugas y estén provistas de sensores discriminantes para pozos, sensores en el espacio anular del Tanque y sensores de nivel para cajas contenedoras del equipo medidor y bomba, deberán como mínimo cada año, activar cada uno de los sensores para probar su funcionamiento. Se deberá dejar registro de estas pruebas simuladas en la memoria de la consola, para una posterior revisión del ente verificador. La estación deberá contar con un manual para este propósito."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si cada sensor se activa, genera la alarma y el evento queda registrado en la consola.", "params": [], "instrumentos": [], "eval": "lista", "pasos": [{"n": "1", "ref": "5.6.2 r)", "texto": "Identifique el sensor (tipo y ubicación) y el manual de la prueba.", "borrador": false}, {"n": "2", "ref": "5.6.2 r)", "texto": "Active el sensor según el manual.", "borrador": false}, {"n": "3", "ref": "5.6.2 r)", "texto": "Verifique la alarma o la lectura en la consola y el registro de la prueba simulada en su memoria.", "borrador": false}, {"n": "4", "ref": "5.6.2 r)", "texto": "Restablezca el sensor y confirme que vuelve a condición normal.", "borrador": false}], "campos": [{"k": "ident", "label": "Sensor (ubicación)", "tipo": "text", "req": true, "pers": true}, {"k": "tipo", "label": "Tipo de sensor", "tipo": "select", "opts": ["Discriminante de pozo", "Espacio anular del tanque", "Nivel en caja contenedora del medidor", "Nivel en caja contenedora de bomba"], "req": true}, {"k": "manual", "label": "La estación cuenta con el manual de la prueba", "tipo": "check", "req": true}, {"k": "activado", "label": "El sensor se activó al probarlo", "tipo": "check", "req": true}, {"k": "alarma", "label": "Se generó la alarma o lectura en la consola", "tipo": "check", "req": true}, {"k": "registro", "label": "Registro en la memoria de la consola", "tipo": "check", "req": true}, {"k": "restablecido", "label": "Sensor restablecido a condición normal", "tipo": "check", "req": true}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "sensor", "label": "Sensor identificado en su ubicación", "req": true}, {"k": "activacion", "label": "Activación del sensor", "req": true}, {"k": "consola", "label": "Alarma o registro en la consola", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio", "req": true}], "accionNC": "La resolución no fija la acción: reparar o reemplazar el sensor, repetir la activación y registrarlo en la bitácora (5 d).", "notas": ["Pasos auxiliares y parámetros validados por el responsable técnico de TruckServices SAS."]}, {"id": "pozos", "n": 14, "file": "14-inspeccion-pozos-monitoreo-observacion", "prefijo": "IPM", "titulo": "Inspección de pozos de monitoreo y observación (antes y después de las pruebas)", "corto": "Pozos de monitoreo y observación", "resumen": "Inspección de contaminación y variación de niveles en los pozos, antes y después de las pruebas de tanque y línea.", "elemento": "Pozo de monitoreo / observación", "elementos": "Pozos", "numeral": "5.6.2 q)", "frecuencia": "En cada prueba de tanque y línea (antes y después)", "objeto": "Inspeccionar los pozos de monitoreo y/u observación antes y después de las pruebas en tanque y línea, revisando contaminación y variación de niveles, y el espacio anular de los tanques de doble pared.", "ejecutor": "La resolución no restringe quién lo ejecuta.", "normativa": [{"ref": "5.6.2 q)", "texto": "Se deben inspeccionar los Pozos de Monitoreo y/u observación antes y después de la realización de las pruebas en Tanque y línea, revisando si existe contaminación y variación de niveles. En caso de que el Tanque sea doble pared se deberá verificar el espacio anular, de acuerdo con las recomendaciones entregadas por el fabricante."}, {"ref": "5.3.1 e)", "texto": "Pozo de observación (en la fosa de tanques, mínimo 3 o 1 si la fosa es impermeable) y pozo de monitoreo (3, en triángulo, 1 m por debajo de la cota fondo de los tanques, cuando el nivel freático esté más arriba de 7 m), que deben sobresalir 3 cm del piso."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si el pozo no presenta contaminación por hidrocarburos ni variación anormal de nivel respecto de la medición anterior.", "params": [], "instrumentos": ["cinta"], "eval": "lista", "pasos": [{"n": "1", "ref": "5.6.2 q)", "texto": "Inspeccione el pozo ANTES de la prueba de tanque o línea: contaminación y nivel.", "borrador": false}, {"n": "2", "ref": "5.6.2 q)", "texto": "Repita la inspección DESPUÉS de la prueba y compare el nivel.", "borrador": false}, {"n": "3", "ref": "5.6.2 q)", "texto": "En tanques de doble pared, verifique el espacio anular según el fabricante.", "borrador": false}, {"n": "4", "ref": "5 d)", "texto": "Registre el resultado en la bitácora.", "borrador": false}], "campos": [{"k": "ident", "label": "Pozo (tipo y ubicación)", "tipo": "text", "req": true, "pers": true}, {"k": "momento", "label": "Momento de la inspección", "tipo": "select", "opts": ["Antes de la prueba", "Después de la prueba"], "req": true}, {"k": "nivel", "label": "Nivel medido en el pozo", "tipo": "num", "unit": "m", "req": true}, {"k": "nivelAnt", "label": "Nivel de la medición anterior (si existe)", "tipo": "num", "unit": "m"}, {"k": "contamina", "label": "Se observa contaminación por hidrocarburos", "tipo": "check", "neg": true, "ref": "5.6.2 q)"}, {"k": "variacion", "label": "Se observa variación anormal de nivel", "tipo": "check", "neg": true, "ref": "5.6.2 q)"}, {"k": "anular", "label": "Espacio anular verificado (tanques de doble pared)", "tipo": "check", "ref": "5.6.2 q)"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "pozo", "label": "Pozo identificado y tapa sobresaliendo 3 cm", "req": true}, {"k": "medida", "label": "Medición del nivel", "req": true}, {"k": "muestra", "label": "Muestra o interior del pozo", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general de la ubicación de los pozos", "req": true}], "accionNC": "Si hay contaminación, dar aviso, descontaminar el área afectada según corresponda (5.6.2 p)) y repetir la inspección; registrar en la bitácora (5 d).", "notas": ["La resolución no fija el criterio de «variación» de nivel: se compara con la medición anterior y el responsable técnico decide."]}, {"id": "calidad-diesel", "n": 15, "file": "15-prueba-abreviada-calidad-diesel", "prefijo": "PCD", "titulo": "Prueba abreviada de calidad en el recibo de diésel", "corto": "Calidad en el recibo de diésel", "resumen": "Muestra del recibo y del fondo del tanque: claro, brillante y translúcido; drenaje o limpieza si hay agua o contaminantes.", "elemento": "Tanque / recibo de diésel", "elementos": "Tanques o recibos de diésel", "numeral": "5.6.2 l)", "frecuencia": "En cada recibo de diésel", "objeto": "Verificar la calidad aparente del diésel recibido y el estado del fondo del tanque, según el numeral 11 de la NTC 6032, dejando registro.", "ejecutor": "La resolución no restringe quién lo ejecuta. Para ingresar al tanque se exige certificado de trabajo en espacios confinados (Res. 491 de 2020).", "normativa": [{"ref": "5.6.2 l)", "texto": "Se debe realizar prueba abreviada de calidad en el recibo del diésel, de acuerdo con el numeral 11 de la NTC 6032:2013 y se debe dejar registro. El fondo del Tanque debe ser verificado, si la muestra presenta agua o el combustible no es claro, brillante y traslúcido se debe efectuar «Drenaje» al fondo del Tanque. Si después de efectuar este, no se logra obtener muestra con apariencia clara y brillante o si hubiere evidencia de una cantidad apreciable de contaminantes sólidos o de crecimiento microbiológico, se deberá proceder a efectuar limpieza interna del Tanque. En caso de realizar ingreso se deberá cumplir con la Resolución 491 de 2020. Además, se deberá verificar el estado de corrosión del Tanque. El personal que ingrese al Tanque deberá contar con el Certificado para trabajo en espacios confinados."}, {"ref": "4.1 j)", "texto": "Las instalaciones que almacenen diésel, biodiésel o sus mezclas deberán cumplir la NTC 6032 y llevar el Registro de Evidencias de Aplicación de las Buenas Prácticas."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si la muestra es clara, brillante y traslúcida, sin agua, contaminantes sólidos ni crecimiento microbiológico; si no, drenar y, de persistir, limpiar el tanque.", "params": [], "instrumentos": [], "eval": "lista", "pasos": [{"n": "1", "ref": "5.6.2 l)", "texto": "Tome la muestra del recibo y realice la prueba abreviada de la NTC 6032 (numeral 11): apariencia clara, brillante y traslúcida.", "borrador": false}, {"n": "2", "ref": "5.6.2 l)", "texto": "Verifique el fondo del tanque. Si la muestra presenta agua o el combustible no es claro, brillante y traslúcido, efectúe el drenaje del fondo.", "borrador": false}, {"n": "3", "ref": "5.6.2 l)", "texto": "Si tras el drenaje no se obtiene muestra clara y brillante, o hay contaminantes sólidos o crecimiento microbiológico, proceda a la limpieza interna del tanque, con certificado de espacios confinados (Res. 491/2020).", "borrador": false}, {"n": "4", "ref": "5.6.2 l)", "texto": "Verifique el estado de corrosión del tanque y tome las medidas pertinentes.", "borrador": false}, {"n": "5", "ref": "5.6.2 l)", "texto": "Deje registro de la prueba.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque y remisión / carrotanque", "tipo": "text", "req": true, "pers": true}, {"k": "aspecto", "label": "Muestra clara, brillante y traslúcida", "tipo": "check", "req": true, "ref": "paso 1"}, {"k": "agua", "label": "La muestra del fondo presenta agua", "tipo": "check", "neg": true, "ref": "paso 2"}, {"k": "contam", "label": "Hay contaminantes sólidos o crecimiento microbiológico", "tipo": "check", "neg": true, "ref": "paso 3"}, {"k": "drenaje", "label": "Se efectuó drenaje del fondo (si había agua o turbidez)", "tipo": "check", "ref": "paso 2"}, {"k": "limpieza", "label": "Se requiere limpieza interna del tanque", "tipo": "check", "neg": true, "ref": "paso 3"}, {"k": "corrosion", "label": "Se observa corrosión en el tanque", "tipo": "check", "neg": true, "ref": "paso 4"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "muestra", "label": "Muestra del recibo (aspecto)", "req": true}, {"k": "fondo", "label": "Muestra del fondo del tanque", "req": true}, {"k": "registro", "label": "Registro de la prueba", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general de la descarga", "req": true}], "accionNC": "Drenar el fondo; si persiste, limpiar el tanque con certificado de espacios confinados (Res. 491/2020) y verificar corrosión (5.6.2 l)); registrar en la bitácora (5 d).", "notas": ["Aplica a instalaciones con diésel o mezclas con biodiésel."]}, {"id": "hermeticidad", "n": 16, "file": "16-prueba-hermeticidad-tanques-y-lineas", "prefijo": "PHT", "titulo": "Prueba de hermeticidad de tanques y líneas de conducción (registro del ejecutor)", "corto": "Hermeticidad de tanques y líneas", "resumen": "Registro de la prueba bienal de hermeticidad por presión: pérdida de presión, fluido, equipos y personal.", "elemento": "Tanque o línea probada", "elementos": "Tanques o líneas probadas", "numeral": "5.6.2 m) y n)", "frecuencia": "Cada 2 años (mínimo)", "objeto": "Registrar la prueba de verificación de la hermeticidad del sistema de almacenamiento (tanques) y del sistema de conducción (líneas), con procedimiento, resultados, equipos y personal que la realiza.", "ejecutor": "Debe realizarla un Organismo de Inspección acreditado por ONAC (ISO/IEC 17020) con alcance UNE-EN 13160 y/o NFPA 30. Mientras no existan 2 OIN acreditados y durante los 2 años siguientes a la vigencia, se acepta un certificado de primera parte (ISO/IEC 17050-1 y -2). Este informe no reemplaza el del OIN.", "normativa": [{"ref": "5.6.2 m)", "texto": "Se deberán realizar pruebas de verificación de la hermeticidad del sistema de almacenamiento de combustible, mínimo una vez cada 2 años. Las deberá realizar un organismo de inspección acreditado por ONAC bajo la norma ISO/IEC 17020 con alcance en la norma UNE-EN 13160 y/o NFPA 30. El procedimiento debe seguir las recomendaciones del fabricante y nunca sobrepasar la presión máxima de operación del Tanque. Para Tanques que hayan contenido Líquidos Inflamables no podrá utilizarse aire como fluido de prueba. El informe de resultados deberá incluir, como mínimo: el procedimiento, la representación gráfica del comportamiento de cada prueba, el reporte de resultados, los equipos utilizados y el personal que realiza la prueba."}, {"ref": "5.6.2 n)", "texto": "Igual exigencia para el sistema de conducción de combustible (tuberías), sin sobrepasar la presión máxima de operación de la tubería, sin aire en tuberías que hayan contenido inflamables y con el mismo contenido mínimo del informe. Las estaciones con sistema LLD pueden mostrar sus resultados como evidencia (5.6.2 o))."}, {"ref": "5.6.2 p)", "texto": "Los resultados de las pruebas realizadas en Tanques y tuberías deberán ser remitidos por los agentes de la cadena a la Dirección de Hidrocarburos. En caso de resultados no satisfactorios, se procederá al cambio de la línea defectuosa, la repotenciación o al cambio del Tanque, y a la descontaminación del área afectada."}, {"ref": "3.1 Pruebas de hermeticidad", "texto": "Ensayo no destructivo que permite detectar un caudal de fuga conforme a un procedimiento dado, teniendo en cuenta la dilatación térmica, las pérdidas por evaporación y otras variables, incluido el nivel de aguas subterráneas. Para las estaciones se definen tres tipos de prueba (inicial, de instalación y de operación o periódica); la tabla de la resolución fija presiones y pérdida máxima de presión (0,5 psi en la de instalación)."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si la pérdida de presión no supera la admisible del procedimiento del fabricante, la presión de prueba no excede la máxima de operación, no se usó aire en equipos que contuvieron inflamables y se siguió el procedimiento del fabricante.", "params": [{"k": "tiempoMin", "label": "Duración mínima de la prueba", "unit": "min", "v": 60, "ref": "5.6.1 c): 1 hora; ajustar al fabricante"}], "instrumentos": ["manometro"], "eval": "perdida", "pasos": [{"n": "1", "ref": "5.6.2 m), n)", "texto": "Obtenga el procedimiento y la presión máxima de operación del tanque o de la tubería recomendados por el fabricante.", "borrador": false}, {"n": "2", "ref": "5.6.2 m), n)", "texto": "Verifique que el fluido de prueba no es aire si el tanque o la tubería contuvo líquidos inflamables.", "borrador": false}, {"n": "3", "ref": "5.6.2 m), n)", "texto": "Aísle el tanque o el tramo, conecte el manómetro o registrador y presurice sin sobrepasar la presión máxima de operación.", "borrador": false}, {"n": "4", "ref": "5.6.2 m), n)", "texto": "Registre la presión inicial y el inicio; mantenga la prueba el tiempo definido.", "borrador": false}, {"n": "5", "ref": "5.6.2 m), n)", "texto": "Registre la presión final y la gráfica del comportamiento de la prueba.", "borrador": false}, {"n": "6", "ref": "5.6.2 p)", "texto": "Si el resultado no es satisfactorio, proceda al cambio de la línea, repotenciación o cambio del tanque y a la descontaminación; remita los resultados a la Dirección de Hidrocarburos.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque o línea (N.º, producto)", "tipo": "text", "req": true, "pers": true}, {"k": "objeto", "label": "Elemento probado", "tipo": "select", "opts": ["Tanque (sistema de almacenamiento)", "Línea de conducción (tubería)"], "req": true}, {"k": "fluido", "label": "Fluido de prueba", "tipo": "select", "opts": ["Líquido", "Gas inerte", "Aire"], "req": true}, {"k": "presDis", "label": "Presión máxima de operación (fabricante)", "tipo": "num", "unit": "psi", "req": true}, {"k": "perdidaFab", "label": "Pérdida de presión admisible según el procedimiento del fabricante", "tipo": "num", "unit": "psi", "req": true}, {"k": "presIni", "label": "Presión inicial de prueba", "tipo": "num", "unit": "psi", "req": true}, {"k": "t0", "label": "Inicio de la prueba", "tipo": "dt"}, {"k": "t1", "label": "Lectura final", "tipo": "dt"}, {"k": "presFin", "label": "Presión final", "tipo": "num", "unit": "psi", "req": true}, {"k": "procFab", "label": "Se siguió el procedimiento recomendado por el fabricante", "tipo": "check", "req": true, "ref": "5.6.2 m)"}, {"k": "aireInfl", "label": "Se usó aire en un equipo que contuvo líquidos inflamables", "tipo": "check", "neg": true, "ref": "5.6.2 m)"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "montaje", "label": "Montaje de la prueba (conexión y aislamiento)", "req": true}, {"k": "p0", "label": "Manómetro: presión inicial", "req": true}, {"k": "p1", "label": "Manómetro: presión final", "req": true}, {"k": "grafica", "label": "Gráfica o carta manográfica del comportamiento", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Cambiar la línea defectuosa, repotenciar o cambiar el tanque y descontaminar el área afectada; remitir los resultados a la Dirección de Hidrocarburos (5.6.2 p)).", "notas": ["La prueba oficial la realiza un OIN acreditado; este registro sirve como informe del ejecutor y evidencia de primera parte durante la transición.", "La pérdida admisible la digita el ejecutor según el procedimiento del fabricante: 5.6.2 m) y n) no fijan un valor para la prueba periódica. La duración es un parámetro ajustable.", "Pasos auxiliares y parámetros validados por el responsable técnico de TruckServices SAS."]}, {"id": "hermeticidad-naval", "n": 17, "file": "17-hermeticidad-artefacto-naval", "prefijo": "HAN", "norma": "Res. 40198/2021", "titulo": "Prueba de hermeticidad de tanques y líneas en Artefacto Naval (estación de servicio fluvial tipo 1 o marítima)", "corto": "Hermeticidad en barcaza estación (Artefacto Naval)", "resumen": "Registro de la prueba bienal de hermeticidad de los tanques y líneas instalados en la barcaza que funciona como estación de servicio, con la verificación de sus certificados navales.", "elemento": "Tanque o línea de la barcaza", "elementos": "Tanques o líneas del Artefacto Naval", "numeral": "5.6.2 m) y n); 7.1 b); 7.3; 8.1 f)", "frecuencia": "Cada 2 años (mínimo)", "objeto": "Registrar la prueba de verificación de la hermeticidad de los tanques y de las líneas de conducción instalados en un Artefacto Naval que opera como Estación de Servicio Fluvial tipo 1 o Marítima, y verificar los certificados navales que la resolución exige a ese artefacto.", "ejecutor": "Debe realizarla un Organismo de Inspección acreditado por ONAC (ISO/IEC 17020) con alcance UNE-EN 13160 y/o NFPA 30 (5.6.2 m) y n)). Este informe es el registro del ejecutor y no reemplaza el del OIN.", "normativa": [{"ref": "3.1 Artefacto Naval", "texto": "Construcción flotante que carece de propulsión propia, que opera en el medio marítimo y fluvial, auxiliar de la navegación pero no destinada a ella (Ley 658 de 2001). Para esta resolución, el Artefacto Naval está dotado con capacidad para almacenar combustibles líquidos."}, {"ref": "3.1 Estación de Servicio Fluvial tipo 1", "texto": "Aquella que cuenta con Tanques de Almacenamiento instalados en el Artefacto Naval, no autopropulsado y anclado o asegurado."}, {"ref": "7.1 b)", "texto": "La Estación de Servicio Fluvial con Artefacto Naval debe cumplir las disposiciones técnicas generales del numeral 5 (incluidas las pruebas periódicas del 5.6.2), con excepción de los literales a) e i) del numeral 5.1 y del numeral 5.2."}, {"ref": "5.6.2 m)", "texto": "Se deberán realizar pruebas de verificación de la hermeticidad del sistema de almacenamiento de combustible, mínimo una vez cada 2 años. Las deberá realizar un organismo de inspección acreditado por ONAC bajo la norma ISO/IEC 17020 con alcance en la norma UNE-EN 13160 y/o NFPA 30. El procedimiento debe seguir las recomendaciones del fabricante y nunca sobrepasar la presión máxima de operación del Tanque. Para Tanques que hayan contenido Líquidos Inflamables no podrá utilizarse aire como fluido de prueba. El informe de resultados deberá incluir, como mínimo: el procedimiento, la representación gráfica del comportamiento de cada prueba, el reporte de resultados, los equipos utilizados y el personal que realiza la prueba."}, {"ref": "5.6.2 n)", "texto": "Igual exigencia para el sistema de conducción de combustible (tuberías): mínimo cada 2 años, por organismo acreditado, sin sobrepasar la presión máxima de operación de la tubería y sin aire en tuberías que hayan contenido inflamables."}, {"ref": "5.6.2 p)", "texto": "Los resultados de las pruebas realizadas en Tanques y tuberías deberán ser remitidos a la Dirección de Hidrocarburos. En caso de resultados no satisfactorios, se procederá al cambio de la línea defectuosa, la repotenciación o al cambio del Tanque, y a la descontaminación del área afectada."}, {"ref": "7.3 a)", "texto": "El almacenamiento en Artefacto Naval debe cumplir con lo estipulado por la Resolución 1918 de 2015 del Ministerio de Transporte (doble casco) o aquella que la modifique o sustituya."}, {"ref": "7.3 b)", "texto": "Toda Estación de Servicio Fluvial con Tanques en el Artefacto Naval debe tener vigentes los certificados de navegabilidad y operaciones para combustible, arqueo, inspección naval, inspección de casco, equipo contra incendio, inspección anual, matrícula, patente de navegación y el certificado de inspección y registro de la capitanía de puerto cuando aplique."}, {"ref": "8.1 f)", "texto": "La Estación de Servicio Marítima con Artefacto Naval debe tener vigentes los mismos certificados, expedidos por la Dirección General Marítima (DIMAR)."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si la pérdida de presión no supera la admisible del procedimiento del fabricante, la presión de prueba no excede la máxima de operación, no se usó aire en equipos que contuvieron inflamables, se siguió el procedimiento del fabricante y los certificados navales del 7.3 b) / 8.1 f) están vigentes.", "params": [{"k": "tiempoMin", "label": "Duración mínima de la prueba", "unit": "min", "v": 60, "ref": "Ajustar al procedimiento del fabricante"}], "instrumentos": ["manometro"], "eval": "perdida", "pasos": [{"n": "1", "ref": "7.1; 3.1", "texto": "Identifique el Artefacto Naval (nombre, matrícula, patente de navegación) y el tipo de estación: fluvial tipo 1 o marítima.", "borrador": false}, {"n": "2", "ref": "7.3 b); 8.1 f)", "texto": "Verifique que los certificados navales están vigentes: navegabilidad y operaciones para combustible, arqueo, inspección naval, inspección de casco, equipo contra incendio, inspección anual y patente de navegación.", "borrador": false}, {"n": "3", "ref": "7.3 a)", "texto": "Verifique la condición de doble casco del almacenamiento (Res. 1918 de 2015 MinTransporte) y que el tanque o compartimiento a probar está identificado.", "borrador": false}, {"n": "4", "ref": "5.6.2 m), n)", "texto": "Obtenga el procedimiento y la presión máxima de operación del tanque o de la tubería recomendados por el fabricante, y la pérdida admisible del procedimiento.", "borrador": false}, {"n": "5", "ref": "5.6.2 m), n)", "texto": "Verifique que el fluido de prueba no es aire si el tanque o la tubería contuvo líquidos inflamables.", "borrador": false}, {"n": "6", "ref": "5.6.2 m), n)", "texto": "Aísle el tanque o el tramo, conecte el manómetro o registrador y presurice sin sobrepasar la presión máxima de operación. Tenga en cuenta el movimiento del artefacto y la temperatura del agua y del ambiente al estabilizar.", "borrador": false}, {"n": "7", "ref": "5.6.2 m), n)", "texto": "Registre la presión inicial y el inicio; mantenga la prueba el tiempo definido; registre la presión final y la gráfica del comportamiento.", "borrador": false}, {"n": "8", "ref": "5.6.2 p)", "texto": "Si el resultado no es satisfactorio, proceda al cambio de la línea, repotenciación o cambio del tanque y a la descontaminación (incluido el cuerpo de agua, con el plan de contingencias 7.1 d)); remita los resultados a la Dirección de Hidrocarburos.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque o línea (N.º / compartimiento, producto)", "tipo": "text", "req": true, "pers": true}, {"k": "tipoEDS", "label": "Tipo de estación", "tipo": "select", "opts": ["Fluvial tipo 1 (Artefacto Naval)", "Marítima con Artefacto Naval"], "req": true}, {"k": "artefacto", "label": "Artefacto Naval: nombre, matrícula y patente", "tipo": "text", "req": true}, {"k": "objeto", "label": "Elemento probado", "tipo": "select", "opts": ["Tanque (sistema de almacenamiento)", "Línea de conducción (tubería)"], "req": true}, {"k": "fluido", "label": "Fluido de prueba", "tipo": "select", "opts": ["Líquido", "Gas inerte", "Aire"], "req": true}, {"k": "presDis", "label": "Presión máxima de operación (fabricante / placa)", "tipo": "num", "unit": "psi", "req": true}, {"k": "perdidaFab", "label": "Pérdida de presión admisible según el procedimiento del fabricante", "tipo": "num", "unit": "psi", "req": true}, {"k": "presIni", "label": "Presión inicial de prueba (estabilizada)", "tipo": "num", "unit": "psi", "req": true}, {"k": "t0", "label": "Inicio de la prueba", "tipo": "dt"}, {"k": "t1", "label": "Lectura final", "tipo": "dt"}, {"k": "presFin", "label": "Presión final", "tipo": "num", "unit": "psi", "req": true}, {"k": "procFab", "label": "Se siguió el procedimiento recomendado por el fabricante", "tipo": "check", "req": true, "ref": "5.6.2 m)"}, {"k": "aireInfl", "label": "Se usó aire en un equipo que contuvo líquidos inflamables", "tipo": "check", "neg": true, "ref": "5.6.2 m)"}, {"k": "certNav", "label": "Certificados navales vigentes (navegabilidad y operaciones para combustible, casco, contra incendio, inspección anual, patente)", "tipo": "check", "req": true, "ref": "7.3 b); 8.1 f)"}, {"k": "dobleCasco", "label": "Almacenamiento con doble casco (Res. 1918/2015)", "tipo": "check", "req": true, "ref": "7.3 a)"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "artefacto", "label": "Artefacto Naval: vista general y matrícula visible", "req": true}, {"k": "certs", "label": "Certificados navales vigentes", "req": true}, {"k": "montaje", "label": "Montaje de la prueba (conexión y aislamiento)", "req": true}, {"k": "p0", "label": "Manómetro: presión inicial", "req": true}, {"k": "p1", "label": "Manómetro: presión final", "req": true}, {"k": "grafica", "label": "Gráfica o carta manográfica del comportamiento", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Cambiar la línea defectuosa, repotenciar o cambiar el tanque y descontaminar el área y el cuerpo de agua afectados (plan de contingencias, 7.1 d)); remitir los resultados a la Dirección de Hidrocarburos (5.6.2 p)). Si faltan certificados navales, la estación no cumple 7.3 b) / 8.1 f).", "notas": ["La prueba oficial la realiza un OIN acreditado; este registro sirve como informe del ejecutor.", "La pérdida admisible y la duración las fija el procedimiento del fabricante: la resolución no da un valor fijo para la prueba periódica.", "La Res. 1918/2015 no fija un procedimiento de prueba de tanques; remite a las reglas ABS para el doble casco."]}, {"id": "barcaza-transporte", "n": 18, "file": "18-barcaza-transporte-doble-casco", "prefijo": "BTC", "norma": "Res. 1918/2015 MinTransporte", "notaInforme": "Informe del ejecutor. Esta barcaza no es una estación de servicio: no le aplica la Res. 40198/2021. La inspección técnica oficial la realiza el Ministerio de Transporte (Inspecciones Fluviales) o la casa clasificadora; este documento no la reemplaza.", "titulo": "Verificación de doble casco y estanqueidad de tanques de carga en barcaza de transporte de hidrocarburos", "corto": "Barcaza de transporte: doble casco y tanques", "resumen": "Registro de la verificación de doble casco, espacios vacíos estancos y prueba de estanqueidad de los tanques de carga de una barcaza que transporta combustible (no es estación de servicio).", "elemento": "Tanque de carga o espacio vacío", "elementos": "Tanques de carga y espacios vacíos", "numeral": "Arts. 1, 3.2, 5, 6, 7 y 8", "frecuencia": "Inspección técnica cada 3 años; dique seco cada 6 años", "objeto": "Verificar que la barcaza de transporte de hidrocarburos cumple la condición de doble casco con espacios vacíos estancos y registrar la prueba de estanqueidad de sus tanques de carga, como soporte para la inspección técnica del Ministerio de Transporte o de la casa clasificadora.", "ejecutor": "La inspección técnica oficial la realiza el Ministerio de Transporte a través de las Inspecciones Fluviales o quien delegue (art. 6); se aceptan las inspecciones de embarcaciones con certificación de clase de una casa clasificadora (art. 8, parágrafo). Este informe es el registro del ejecutor de la prueba.", "normativa": [{"ref": "Res. 40198/2021 (alcance)", "texto": "La Res. 40198/2021 aplica a estaciones de servicio, plantas de abastecimiento, gran consumidor y tanques del consumidor final. Una barcaza que solo transporta combustible no es estación de servicio: se rige por las normas de transporte (Ministerio de Transporte / DIMAR)."}, {"ref": "Res. 1918/2015 art. 1", "texto": "Establece el doble casco como condición para la matrícula y la renovación de la patente de navegación de botes tanque, embarcaciones autopropulsadas y artefactos fluviales que transportan a granel petroquímicos, asfaltos, hidrocarburos y sus derivados."}, {"ref": "Res. 1918/2015 art. 2", "texto": "Aplica a estas embarcaciones importadas o construidas en Colombia, independientemente de su tonelaje de registro bruto y de la fecha de construcción o adaptación."}, {"ref": "Res. 1918/2015 art. 3.2", "texto": "Los mamparos de los tanques deben estar separados del forro o lámina externa por espacios vacíos estancos no destinados a carga."}, {"ref": "Res. 1918/2015 art. 6", "texto": "El Ministerio de Transporte, a través de las Inspecciones Fluviales o quien delegue, realiza inspecciones técnicas cada tres (3) años según el Formato de Inspección Técnica."}, {"ref": "Res. 1918/2015 art. 7", "texto": "Las embarcaciones deben inspeccionarse en dique seco cada seis (6) años, alternadas con las inspecciones técnicas, según los manuales de la ABS; si se detecta deterioro, deben llevarse a dique seco en un plazo de dos meses."}, {"ref": "Res. 1918/2015 art. 8", "texto": "Se permite adaptar embarcaciones no construidas bajo reglas ABS si los espacios vacíos cumplen reglamentaciones internacionalmente aceptadas; se aceptan las inspecciones de embarcaciones con certificación de clase de una casa clasificadora nacional o internacional."}], "criterio": "Conforme si la barcaza tiene doble casco con espacios vacíos estancos, la prueba de estanqueidad de tanques de carga y espacios vacíos resultó satisfactoria según el procedimiento de la casa clasificadora o del astillero, no hay deterioro, y la inspección técnica (≤ 3 años), el dique seco (≤ 6 años), la patente de navegación y el permiso de operación están vigentes.", "params": [], "instrumentos": ["manometro", "medidorEspesor"], "eval": "lista", "pasos": [{"n": "1", "ref": "Arts. 1, 5", "texto": "Identifique la barcaza (nombre, matrícula, patente de navegación, permiso de operación) y el producto transportado.", "borrador": false}, {"n": "2", "ref": "Art. 3.2", "texto": "Verifique la condición de doble casco: los mamparos de los tanques separados del forro externo por espacios vacíos estancos no destinados a carga.", "borrador": false}, {"n": "3", "ref": "Arts. 6, 7, 8", "texto": "Verifique la fecha de la última inspección técnica (máximo 3 años), del último dique seco (máximo 6 años) y, si la tiene, la certificación de clase.", "borrador": false}, {"n": "4", "ref": "Art. 7 (manuales ABS)", "texto": "Pruebe la estanqueidad de los tanques de carga y de los espacios vacíos según el procedimiento de la casa clasificadora o del astillero (presión, fluido y tiempo de ese procedimiento); nunca use aire en tanques que contuvieron inflamables sin desgasificar.", "borrador": false}, {"n": "5", "ref": "Art. 7", "texto": "Inspeccione el estado de mamparos, forro y espacios vacíos: corrosión, deformaciones, filtraciones o producto en los espacios vacíos.", "borrador": false}, {"n": "6", "ref": "Art. 7", "texto": "Si detecta deterioro, registre que la barcaza debe ir a dique seco en un plazo máximo de dos meses.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque de carga o espacio vacío (N.º)", "tipo": "text", "req": true, "pers": true}, {"k": "barcaza", "label": "Barcaza: nombre, matrícula y patente", "tipo": "text", "req": true}, {"k": "metodo", "label": "Método de la prueba de estanqueidad", "tipo": "select", "opts": ["Hidrostática", "Presión con gas inerte", "Otro (casa clasificadora)"], "req": true}, {"k": "procedimiento", "label": "Procedimiento aplicado (casa clasificadora / astillero) y valores de prueba", "tipo": "area"}, {"k": "dobleCasco", "label": "Doble casco con espacios vacíos estancos no destinados a carga", "tipo": "check", "req": true, "ref": "Art. 3.2"}, {"k": "pruebaOk", "label": "Prueba de estanqueidad satisfactoria según el procedimiento aplicado", "tipo": "check", "req": true, "ref": "Art. 7"}, {"k": "inspTec", "label": "Inspección técnica vigente (máximo 3 años)", "tipo": "check", "req": true, "ref": "Art. 6"}, {"k": "diqueSeco", "label": "Dique seco vigente (máximo 6 años)", "tipo": "check", "req": true, "ref": "Art. 7"}, {"k": "patente", "label": "Patente de navegación y permiso de operación vigentes", "tipo": "check", "req": true, "ref": "Arts. 1, 5"}, {"k": "deterioro", "label": "Se detectó deterioro (corrosión, deformación o filtración)", "tipo": "check", "neg": true, "ref": "Art. 7"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "barcaza", "label": "Barcaza: vista general y matrícula visible", "req": true}, {"k": "espacio", "label": "Espacio vacío entre mamparo y forro (doble casco)", "req": true}, {"k": "montaje", "label": "Montaje de la prueba de estanqueidad", "req": true}, {"k": "lectura", "label": "Instrumento: lectura inicial y final", "req": true}, {"k": "docs", "label": "Inspección técnica, dique seco, patente y permiso vigentes", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Corregir la condición (reparación del mamparo, forro o tanque) y repetir la prueba; si se detectó deterioro, llevar la barcaza a dique seco en un plazo máximo de dos meses (art. 7). Sin doble casco no se renueva la patente ni el permiso de operación (arts. 1 y 5).", "notas": ["La Res. 1918/2015 no fija presión, fluido ni tiempo para la prueba de los tanques: se aplican los del procedimiento de la casa clasificadora o del astillero (reglas ABS).", "Si la barcaza también despacha combustible a embarcaciones, es una estación fluvial tipo 1: use además la prueba 17."]}, {"id": "hermeticidad-atmosferico", "n": 19, "file": "19-hermeticidad-tanques-atmosfericos", "prefijo": "HTA", "norma": "Res. 40198/2021", "titulo": "Prueba de hermeticidad de tanques atmosféricos verticales (plantas de abastecimiento)", "corto": "Hermeticidad de tanques atmosféricos", "resumen": "Registro de la prueba de hermeticidad de tanques verticales atmosféricos, hidrostática o neumática entre 1,5 y 2,5 psi, con la periodicidad según el servicio del tanque.", "elemento": "Tanque atmosférico vertical", "elementos": "Tanques atmosféricos verticales", "numeral": "11.7 b), d), e)", "frecuencia": "Cada 5 años (transferencia de custodia); entre 5 y 10 años (demás servicios)", "objeto": "Registrar la prueba de hermeticidad de los tanques de almacenamiento atmosféricos verticales de plantas de abastecimiento, por método hidrostático o por presión manométrica, y verificar el estado de paredes y cimentaciones.", "ejecutor": "La resolución no restringe quién ejecuta la prueba del 11.7 b). Se recomienda personal calificado en inspección de tanques (API 653) y seguir la norma de fabricación del tanque.", "normativa": [{"ref": "3.1 Tanque de almacenamiento atmosférico", "texto": "Tanque diseñado para operar desde la presión atmosférica hasta una presión manométrica de 6,9 kPa (1,0 psi), medida en la parte alta del tanque."}, {"ref": "11.7 b)", "texto": "La hermeticidad de los Tanques verticales debe hacerse ya sea hidrostáticamente o con una presión manométrica no inferior de diez (10) kPa (1,5 psi) y no mayor de diecisiete (17) kPa (2,5 psi). Para Tanques en servicio de transferencia de custodia, la prueba debe realizarse una vez cada cinco (5) años; para los demás servicios puede hacerse entre cinco (5) y diez (10) años."}, {"ref": "11.7 d)", "texto": "Todos los Tanques, antes de su puesta en servicio, deben ser probados de acuerdo con los lineamientos de la norma de fabricación, lo cual se debe evidenciar en el rotulado del Tanque o mediante el documento emitido por el fabricante."}, {"ref": "11.7 e)", "texto": "Se debe comprobar el buen estado de las paredes de los Tanques, así como el estado de las cimentaciones, soportes, cerramientos, drenajes, bombas y equipos e instalaciones operacionales, con la misma periodicidad."}, {"ref": "11.7 f)", "texto": "Se deben medir los espesores de lámina de los Tanques metálicos de manera periódica para comprobar y corregir picaduras, oxidaciones o golpes que puedan inducir roturas y fugas, con la misma periodicidad."}], "criterio": "Conforme si: (hidrostática) el nivel se mantiene sin descenso y sin fugas visibles; (presión) la presión de prueba está entre 1,5 y 2,5 psi sin superar la de diseño del tanque, se mantiene sin pérdida mayor a la admisible del fabricante y no hay fugas en soldaduras ni accesorios; y paredes y cimentación están en buen estado.", "params": [{"k": "presMin", "label": "Presión manométrica mínima de prueba", "unit": "psi", "v": 1.5, "ref": "11.7 b) (10 kPa)"}, {"k": "presMax", "label": "Presión manométrica máxima de prueba", "unit": "psi", "v": 2.5, "ref": "11.7 b) (17 kPa)"}, {"k": "tiempoMin", "label": "Duración mínima de la prueba", "unit": "min", "v": 60, "ref": "Criterio interno (11.7 c) iii) para tubería: 1 h); ajustar a la norma de fabricación"}], "instrumentos": ["manometro", "nivel", "medidorEspesor"], "eval": "atmosferico", "pasos": [{"n": "1", "ref": "11.7 d)", "texto": "Identifique el tanque (N.º, producto, capacidad, servicio: transferencia de custodia o no) y su norma de fabricación y presión de diseño en la placa o documento del fabricante.", "borrador": false}, {"n": "2", "ref": "11.7 e), f)", "texto": "Inspeccione paredes, techo, cimentación, soportes y drenajes; mida espesores de lámina si corresponde.", "borrador": false}, {"n": "3", "ref": "11.7 b)", "texto": "Elija el método: hidrostático o por presión manométrica. Si la presión de diseño del tanque es menor que 1,5 psi, use el método hidrostático.", "borrador": false}, {"n": "4", "ref": "11.7 b)", "texto": "Hidrostático: llene con agua al nivel de prueba, registre el nivel inicial, espere el tiempo definido y registre el nivel final; revise fugas en soldaduras, fondo y accesorios.", "borrador": false}, {"n": "5", "ref": "11.7 b)", "texto": "Presión: presurice entre 1,5 y 2,5 psi sin superar la presión de diseño; estabilice, registre la presión inicial y final y aplique solución jabonosa en soldaduras y accesorios.", "borrador": false}, {"n": "6", "ref": "Seguridad", "texto": "Si el tanque contuvo inflamables, no use aire sin desgasificar: use gas inerte o el método hidrostático.", "borrador": false}, {"n": "7", "ref": "11.7", "texto": "Registre resultados, fotos y la fecha de la próxima prueba (5 años custodia; 5–10 años demás servicios).", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque (N.º, producto, capacidad)", "tipo": "text", "req": true, "pers": true}, {"k": "servicio", "label": "Servicio del tanque", "tipo": "select", "opts": ["Transferencia de custodia (cada 5 años)", "Otros servicios (entre 5 y 10 años)"], "req": true}, {"k": "metodo", "label": "Método", "tipo": "select", "opts": ["Hidrostático", "Presión manométrica"], "req": true}, {"k": "presDis", "label": "Presión de diseño del tanque (placa / fabricante)", "tipo": "num", "unit": "psi"}, {"k": "fluido", "label": "Fluido (método de presión)", "tipo": "select", "opts": ["Gas inerte", "Aire (tanque desgasificado o nuevo)"]}, {"k": "perdidaFab", "label": "Pérdida admisible según norma de fabricación / fabricante", "tipo": "num", "unit": "psi"}, {"k": "presIni", "label": "Presión inicial estabilizada", "tipo": "num", "unit": "psi"}, {"k": "presFin", "label": "Presión final", "tipo": "num", "unit": "psi"}, {"k": "nivelIni", "label": "Nivel inicial de agua (método hidrostático)", "tipo": "num", "unit": "mm"}, {"k": "nivelFin", "label": "Nivel final de agua (método hidrostático)", "tipo": "num", "unit": "mm"}, {"k": "t0", "label": "Inicio de la prueba", "tipo": "dt"}, {"k": "t1", "label": "Lectura final", "tipo": "dt"}, {"k": "sinFugas", "label": "Sin fugas en soldaduras, fondo y accesorios", "tipo": "check", "req": true, "ref": "11.7 b)"}, {"k": "paredesOk", "label": "Paredes, techo, cimentación y soportes en buen estado", "tipo": "check", "req": true, "ref": "11.7 e)"}, {"k": "aireInfl", "label": "Se usó aire en un tanque que contuvo inflamables sin desgasificar", "tipo": "check", "neg": true, "ref": "Seguridad"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "placa", "label": "Placa o rotulado del tanque (norma y presión de diseño)", "req": true}, {"k": "montaje", "label": "Montaje de la prueba", "req": true}, {"k": "l0", "label": "Lectura inicial (manómetro o nivel)", "req": true}, {"k": "l1", "label": "Lectura final (manómetro o nivel)", "req": true}, {"k": "soldaduras", "label": "Revisión de soldaduras / solución jabonosa", "req": true}, {"k": "cimentacion", "label": "Estado de paredes y cimentación", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reparar la fuga o el daño según la norma de fabricación (API 653 para tanques en servicio), repetir la prueba y registrar el resultado; si la reparación no es posible, sacar el tanque de servicio.", "notas": ["El rango 1,5–2,5 psi del 11.7 b) es mayor que la presión de diseño de un tanque atmosférico (hasta 1,0 psi, numeral 3.1): nunca supere la presión de diseño; si no permite el rango, use el método hidrostático.", "La resolución no fija la duración ni la pérdida admisible para tanques; se toman de la norma de fabricación o del fabricante."]}, {"id": "hermeticidad-horizontal", "n": 20, "file": "20-hermeticidad-tanques-horizontales-superficie", "prefijo": "HTH", "norma": "Res. 40198/2021", "titulo": "Prueba de hermeticidad de tanques atmosféricos cilíndricos horizontales en superficie (todo tipo de instalación)", "corto": "Hermeticidad de tanques horizontales en superficie", "resumen": "Prueba de hermeticidad de tanques horizontales sobre el nivel del suelo en estaciones de servicio, plantas, gran consumidor y consumidor final; la periodicidad, el ejecutor y la presión dependen del tipo de instalación.", "elemento": "Tanque horizontal en superficie", "elementos": "Tanques horizontales en superficie", "numeral": "3.1; 5.3.2; 5.6.2 m); 10.1 f); 10.3 b); 11.7 d)-f); 12", "frecuencia": "Según la instalación: cada 2 años (EDS, gran consumidor, consumidor final ≥ 7.500 L); 5 o 5–10 años (plantas)", "objeto": "Registrar la prueba de hermeticidad de tanques de almacenamiento atmosféricos, cilíndricos, horizontales, instalados en superficie, en cualquier tipo de instalación regulada por la Res. 40198/2021, y verificar las condiciones de instalación del tanque en superficie.", "ejecutor": "Estaciones de servicio, gran consumidor y consumidor final con tanques de 7.500 L o más: organismo de inspección acreditado por ONAC (ISO/IEC 17020, UNE-EN 13160 y/o NFPA 30), según 5.6.2 m). Plantas de abastecimiento y tanques estacionarios menores de 7.500 L: la resolución no restringe el ejecutor; seguir la norma de fabricación del tanque.", "normativa": [{"ref": "3.1 Tanque atmosférico", "texto": "Tanque diseñado para operar desde la presión atmosférica hasta una presión manométrica de 6,9 kPa (1,0 psi), medida en la parte alta del tanque."}, {"ref": "3.1 Pruebas de hermeticidad (tabla)", "texto": "Cuando la prueba es por presión: inicial 48,26 kPa (7 psi); de instalación 34,47 kPa (5 psi), pérdida máxima de presión 0,5 psi (3,447 kPa); de operación o periódica 17,24–20,68 kPa (2,5–3 psi). (Texto escaneado: verificar contra el original.)"}, {"ref": "5.3 a) normas de fabricación", "texto": "Tanques metálicos diseñados y construidos según normas como UL 142 (tanques de acero sobre tierra), UNE-EN 976-1, UNE 62350 / 62351 (tanques horizontales), UL 2085 (tanques aéreos protegidos) o UL 2080."}, {"ref": "5.3.2 c), d), e)", "texto": "Tanques en superficie metálicos protegidos externamente con pintura anticorrosiva y/o protección catódica; con recinto de contención impermeable de al menos el 100 % del tanque (o el mayor más el 10 % de los demás) y tuberías de respiración."}, {"ref": "5.3.2 l), n)", "texto": "Ventilación adecuada para evitar vacíos o presiones que excedan la de diseño; válvula de presión-vacío en respiraderos de gasolina. En tanques horizontales todas las aberturas deben estar en la parte superior, excepto la de drenaje o llenado."}, {"ref": "5.6.2 m)", "texto": "Se deberán realizar pruebas de verificación de la hermeticidad del sistema de almacenamiento de combustible, mínimo una vez cada 2 años. Las deberá realizar un organismo de inspección acreditado por ONAC bajo la norma ISO/IEC 17020 con alcance en la norma UNE-EN 13160 y/o NFPA 30. El procedimiento debe seguir las recomendaciones del fabricante y nunca sobrepasar la presión máxima de operación del Tanque. Para Tanques que hayan contenido Líquidos Inflamables no podrá utilizarse aire como fluido de prueba. El informe de resultados deberá incluir, como mínimo: el procedimiento, la representación gráfica del comportamiento de cada prueba, el reporte de resultados, los equipos utilizados y el personal que realiza la prueba."}, {"ref": "10.1 f); 10.3 b)", "texto": "El Gran Consumidor con Instalación Fija debe cumplir los numerales 5.5 y 5.6; con tanques superficiales de capacidad total menor a 150.000 L cumple el 5.3.2; en caso contrario, lo de plantas de abastecimiento."}, {"ref": "12 a), b)", "texto": "Consumidor final: tanques de 7.500 L o más se rigen por el numeral 10 (gran consumidor); menores de 7.500 L pueden ser tanques estacionarios (máximo 2.000 gal cada uno), que deben cumplir las especificaciones de la resolución."}, {"ref": "11.7 d), e), f)", "texto": "Plantas: todo tanque se prueba antes de su puesta en servicio según su norma de fabricación; se comprueba el estado de paredes, cimentaciones, soportes y drenajes, y se miden espesores de lámina: cada 5 años en transferencia de custodia, entre 5 y 10 años en los demás servicios."}], "criterio": "Conforme si la presión de prueba no supera la de diseño del tanque, la pérdida no supera la admisible del fabricante o el nivel se mantiene (hidrostática), no hay fugas, no se usó aire en un tanque que contuvo inflamables y las condiciones de instalación en superficie se cumplen.", "params": [{"k": "tiempoMin", "label": "Duración mínima de la prueba", "unit": "min", "v": 60, "ref": "Ajustar al fabricante"}], "instrumentos": ["manometro", "nivel", "medidorEspesor"], "eval": "horizontal", "pasos": [{"n": "1", "ref": "5.3 a); 11.7 d)", "texto": "Identifique el tanque: N.º, producto, capacidad, norma de fabricación (UL 142, UNE 62350, UL 2085…) y presión de diseño en la placa o documento del fabricante.", "borrador": false}, {"n": "2", "ref": "10; 12", "texto": "Determine el tipo de instalación: estación de servicio, gran consumidor, consumidor final (≥ 7.500 L o tanque estacionario < 7.500 L) o planta de abastecimiento. De esto dependen la periodicidad, el ejecutor y el rango de presión.", "borrador": false}, {"n": "3", "ref": "5.3.2 c)-n)", "texto": "Inspeccione la instalación: protección anticorrosiva, recinto de contención impermeable con capacidad suficiente, respiraderos (válvula P/V en gasolina), aberturas en la parte superior, soportes y cimentación; mida espesores si aplica (11.7 f)).", "borrador": false}, {"n": "4", "ref": "5.6.2 m)", "texto": "Si el tanque contuvo inflamables, no use aire: use gas inerte o el método hidrostático.", "borrador": false}, {"n": "5", "ref": "3.1; 5.6.2 m)", "texto": "Presión: aísle el tanque, conecte el manómetro y presurice según el procedimiento del fabricante, sin superar la presión de diseño; si el diseño no permite una prueba neumática, use el método hidrostático.", "borrador": false}, {"n": "6", "ref": "11.7 d)", "texto": "Hidrostático: llene con agua, registre el nivel inicial, espere el tiempo definido, registre el nivel final y revise fugas en soldaduras, silletas y accesorios.", "borrador": false}, {"n": "7", "ref": "5.6.2 m)", "texto": "Registre presión o nivel inicial y final, duración, gráfica del comportamiento, equipos y personal.", "borrador": false}, {"n": "8", "ref": "5.6.2 p)", "texto": "Si el resultado no es satisfactorio, repare o reemplace el tanque y descontamine; en estaciones de servicio remita los resultados a la Dirección de Hidrocarburos.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque (N.º, producto, capacidad)", "tipo": "text", "req": true, "pers": true}, {"k": "tipoInst", "label": "Tipo de instalación", "tipo": "select", "opts": ["Estación de servicio", "Gran consumidor con instalación fija", "Consumidor final (tanque ≥ 7.500 L)", "Consumidor final (tanque estacionario < 7.500 L)", "Planta de abastecimiento"], "req": true}, {"k": "servicio", "label": "Servicio del tanque (solo plantas)", "tipo": "select", "opts": ["Transferencia de custodia", "Otros servicios"]}, {"k": "normaFab", "label": "Norma de fabricación (placa)", "tipo": "text"}, {"k": "metodo", "label": "Método", "tipo": "select", "opts": ["Presión manométrica", "Hidrostático"], "req": true}, {"k": "fluido", "label": "Fluido (método de presión)", "tipo": "select", "opts": ["Gas inerte", "Aire (tanque nuevo o desgasificado)"]}, {"k": "presDis", "label": "Presión de diseño del tanque (placa / fabricante)", "tipo": "num", "unit": "psi"}, {"k": "perdidaFab", "label": "Pérdida admisible según el fabricante", "tipo": "num", "unit": "psi"}, {"k": "presIni", "label": "Presión inicial estabilizada", "tipo": "num", "unit": "psi"}, {"k": "presFin", "label": "Presión final", "tipo": "num", "unit": "psi"}, {"k": "nivelIni", "label": "Nivel inicial de agua (hidrostático)", "tipo": "num", "unit": "mm"}, {"k": "nivelFin", "label": "Nivel final de agua (hidrostático)", "tipo": "num", "unit": "mm"}, {"k": "t0", "label": "Inicio de la prueba", "tipo": "dt"}, {"k": "t1", "label": "Lectura final", "tipo": "dt"}, {"k": "sinFugas", "label": "Sin fugas en soldaduras, silletas, bocas y accesorios", "tipo": "check", "req": true, "ref": "5.6.2 m)"}, {"k": "recinto", "label": "Recinto de contención impermeable con capacidad suficiente", "tipo": "check", "req": true, "ref": "5.3.2 d), e)"}, {"k": "corrosion", "label": "Protección anticorrosiva externa en buen estado", "tipo": "check", "req": true, "ref": "5.3.2 c)"}, {"k": "aberturas", "label": "Aberturas en la parte superior (excepto drenaje o llenado) y respiraderos adecuados", "tipo": "check", "req": true, "ref": "5.3.2 l), n)"}, {"k": "aireInfl", "label": "Se usó aire en un tanque que contuvo inflamables sin desgasificar", "tipo": "check", "neg": true, "ref": "5.6.2 m)"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "placa", "label": "Placa del tanque (norma de fabricación y presión de diseño)", "req": true}, {"k": "recinto", "label": "Tanque y recinto de contención", "req": true}, {"k": "montaje", "label": "Montaje de la prueba", "req": true}, {"k": "l0", "label": "Lectura inicial (manómetro o nivel)", "req": true}, {"k": "l1", "label": "Lectura final (manómetro o nivel)", "req": true}, {"k": "soldaduras", "label": "Revisión de soldaduras, silletas y accesorios", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reparar o reemplazar el tanque según su norma de fabricación, descontaminar el área afectada y repetir la prueba; en estaciones de servicio remitir los resultados a la Dirección de Hidrocarburos (5.6.2 p)).", "notas": ["Igual que la prueba 16: la presión y la pérdida admisible las fija el procedimiento del fabricante; la app no aplica valores fijos de la tabla 3.1 (texto escaneado, por confirmar contra el original).", "Nunca supere la presión de diseño del tanque (un tanque atmosférico se diseña hasta 1,0 psi); si no permite la prueba neumática, use el método hidrostático.", "Para tanques estacionarios menores de 7.500 L la resolución no fija una prueba periódica: se registra como buena práctica según el fabricante."]}];window.RC_PR_INSTR={"regla": "Regla o cinta graduada en mm", "vacuometro": "Vacuómetro o manómetro en mm de agua", "ohmimetro": "Ohmímetro o multímetro", "cinta": "Cinta métrica", "manometro": "Manómetro o registrador de presión (carta manográfica)", "medidorEspesor": "Medidor de espesores por ultrasonido (si aplica)", "nivel": "Regla, cinta o sistema de medición de nivel"};window.RC_ILUS={"barcaza-transporte": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 400\" role=\"img\" aria-label=\"Ilustración: Barcaza de transporte con doble casco\" font-family=\"Arial, sans-serif\">\n<rect x=\"0\" y=\"0\" width=\"680\" height=\"400\" fill=\"#ffffff\"/>\n<rect x=\"0\" y=\"0\" width=\"680\" height=\"28\" fill=\"#fff3d0\"/>\n<text x=\"340\" y=\"19\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#85560a\">ILUSTRACIÓN DE REFERENCIA · no es evidencia de una medición<\/text>\n<rect x=\"0\" y=\"230\" width=\"680\" height=\"170\" fill=\"#cfe6f7\"/><path d=\"M0 238 q 15 -8 30 0 t 30 0\" fill=\"none\" stroke=\"#5aa0d6\" stroke-widt   if (store === 'surtidores') return sv.some(s => s.surtidorId === id);
  if (store === 'tecnicos') return sv.some(s => s.tecnicoId === id);
  if (store === 'patrones') return sv.some(s => s.patrones && Object.values(s.patrones).includes(id));
  return false;
};

// ---------- Paso 5: evidencias ----------

function chart(meses) {
  const mx = Math.max(1, ...meses.map(m => m.n)), W = 420, H = 150, bw = 40, gap = (W - bw * meses.length) / (meses.length + 1);
  return `<svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Servicios por mes">${meses.map((m, i) => { const h = Math.round((m.n / mx) * (H - 22)), x = gap + i * (bw + gap); return `<rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="4" fill="#0e4d86"/><text x="${x + bw / 2}" y="${H - h - 5}" text-anchor="middle" font-size="12" fill="#14202e" font-weight="700">${m.n}</text><text x="${x + bw / 2}" y="${H + 16}" text-anchor="middle" font-size="12" fill="#5b6b7d">${esc(m.l)}</text>`; }).join('')}<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#d5dde7"/></svg>`;
}
RC.views.panel = function () {
  const st = stats(), E = S.empresa;
  const setup = [
    ['Datos de la empresa y logo', !!E.direccion || !!E.telefono || !!E.logo, '#/config'],
    ['Técnico reparador registrado (inscrito en SIMEL)', S.tecnicos.some(t => t.simel), '#/patrones'],
    ['Serafines 5 gal, 0,5 gal y termómetro con certificado', ['serafin5', 'serafin05', 'termometro'].every(t => S.patrones.some(p => p.tipo === t)), '#/patrones'],
    ['Estación y surtidor registrados', S.estaciones.length > 0 && S.surtidores.length > 0, '#/equipos'],
    ['Primer servicio creado', S.servicios.length > 0, '#/servicios']
  ];
  const incompleto = setup.some(x => !x[1]);
  const guia = incompleto ? `<div class="card"><h2 style="margin-top:0">Para comenzar</h2>${setup.map(x => `<div class="res">${u.badge(x[1] ? 'Listo' : 'Pendiente', x[1] ? 'ok' : 'warn')} <a href="${x[2]}">${esc(x[0])}</a></div>`).join('')}</div>` : '';
  const rec = S.servicios.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, 8);
  const ES = { borrador: ['Borrador', 'gray'], ejecucion: ['En ejecución', 'blue'], cerrado: ['Cerrado', 'ok'], reportado: ['Reportado', 'ok'] };
  const tab = rec.length ? `<div class="tw"><table><tr><th>N.º</th><th>Fecha</th><th>Estación / equipo</th><th>Estado</th></tr>${rec.map(s => { const e = byId('estaciones', s.estacionId), x = byId('surtidores', s.surtidorId), t = ES[s.estado]; return `<tr><td><a href="#/servicio/${s.id}/${s.estado === 'cerrado' || s.estado === 'reportado' ? 6 : 1}">${esc(s.numero)}</a></td><td>${u.fmtD(s.fecha)}</td><td>${esc(e ? e.nombre : '—')}<br><span class="src">${x ? esc(x.marca + ' ' + x.modelo) : ''}</span></td><td>${u.badge(t[0], t[1])}</td></tr>`; }).join('')}</table></div>` : '<p class="msg info">Aún no hay servicios.</p>';
  return RC.page('Panel de control', esc(E.razonSocial) + ' · reparador SIMEL ' + esc(E.idSimel), guia +
    `<div class="kpis"><div class="kpi red"><b>${st.abiertos}</b><span>Servicios abiertos</span></div><div class="kpi red"><b>${st.pendSimel}</b><span>Pendientes de reporte en SIMEL</span></div><div class="kpi"><b>${st.pendOavm}</b><span>Pendientes de verificación del OAVM</span></div><div class="kpi"><b>${st.fuera}</b><span>Ensayos fuera del límite (reajustes)</span></div><div class="kpi"><b>${st.mes}</b><span>Servicios del mes</span></div></div>
    <div class="grid g2"><div class="card"><h2 style="margin-top:0">Servicios por mes</h2>${chart(st.meses)}</div><div class="card"><h2 style="margin-top:0">Últimos servicios</h2>${tab}</div></div>
    <p class="src">Estaciones registradas: ${S.estaciones.length} · Surtidores: ${S.surtidores.length} · Patrones: ${S.patrones.length}. Plazo de referencia para SIMEL: ${RC.P('plazoSimelDias')} días calendario (sin alertas).</p>`,
    '<button class="btn red" data-act="svc.pick">+ Nuevo servicio</button>');
};

  { id: 'uso', t: 'Manual de uso de la aplicación', h: `<div class="man"><h4>1. Qué hace</h4><p>Documenta cada <b>reparación con rotura de precintos</b> y la <b>calibración posterior</b> de los medidores de surtidores y dispensadores: datos del equipo, precintos, ensayos con serafín, fotos con sello, firma del cliente, documentos en PDF y los datos listos para cargar en SIMEL.</p>

  { id: 'rep', t: 'Procedimiento de reparación con rotura de precintos', h: `<div class="man"><h4>Objetivo</h4><p>Reparar o ajustar un medidor de combustible líquido que exige romper precintos, manteniendo la trazabilidad y el cumplimiento del Capítulo 7.</p>

  { id: 'cal', t: 'Procedimiento de calibración con serafín', h: `<div class="man"><h4>Equipos</h4><ul><li>Serafín de <b>5 gal (20 L)</b> para caudal máximo y de <b>0,5 gal (2 L)</b> para caudal mínimo, graduados en pasos de 0,05 % y con certificado de calibración con trazabilidad (el OAVM los calibra cada 2 años como máximo).</li><li>Termómetro de inmersión con exactitud mínima de 0,5 °C.</li></ul>
