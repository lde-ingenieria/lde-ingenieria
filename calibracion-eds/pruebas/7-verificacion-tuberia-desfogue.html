…) impermeable y resistente al producto. Las cajas deben garantizar estanqueidad. Las existentes pueden continuar siempre que garanticen estanqueidad definida en la prueba del literal h) iii) del numeral 5.6.2; cuando deje de pasar se deberán reemplazar. Las nuevas deben cumplir UL 2447, Kiwa BRL-K21006 o equivalente."}, {"ref": "3.1 Prueba de estanqueidad", "texto": "PRUEBA DE ESTANQUEIDAD (3.1). Verificación que se realiza a las cajas contenedoras de bombas y/o cajas de equipos de medición para garantizar la estanqueidad de la misma y de los accesorios como botas o sellos pasa tubos instaladas en ella, con el fin de garantizar que el agua del subsuelo no entre a la caja o que, en caso de fuga, el combustible contenido en la caja no salga al subsuelo. Se realiza llenando la caja de líquido hasta la parte superior verificando el nivel inicial de líquido y luego de transcurrido un periodo de tiempo, se vuelve a verificar este nivel. La aprobación o rechazo de esta prueba depende de la diferencia entre el nivel inicial y final."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Aprobada si el nivel de agua no bajó o bajó 4 mm o menos tras 1 hora (5.6.2 h) iii), paso 8). Fallida si bajó más de 4 mm.", "params": [{"k": "descMax", "label": "Descenso máximo permitido", "unit": "mm", "v": 4, "ref": "5.6.2 h) iii), paso 8"}, {"k": "tiempoMin", "label": "Tiempo de reposo mínimo", "unit": "min", "v": 60, "ref": "5.6.2 h) iii), paso 7"}, {"k": "colchonMin", "label": "Agua sobre el punto de fuga más alto, mínimo", "unit": "cm", "v": 10, "ref": "5.6.2 h) iii), paso 4"}], "instrumentos": ["regla"], "eval": "descenso", "pasos": [{"n": "1", "ref": "5.6.2 h) iii) – paso 1", "texto": "Inspeccione y limpie la caja a probar.", "borrador": false}, {"n": "2", "ref": "5.6.2 h) iii) – paso 2", "texto": "Inspeccione visualmente cualquier punto de posible fuga; si es el caso, séllelo o repárelo.", "borrador": false}, {"n": "3", "ref": "5.6.2 h) iii) – paso 3", "texto": "Asegúrese de que los puertos de testeo del espacio intersticial de la tubería doble pared se encuentran sellados y que las botas están adecuadamente instaladas, con el fin de no introducir agua en dicho espacio.", "borrador": false}, {"n": "4", "ref": "5.6.2 h) iii) – paso 4", "texto": "Agregue agua a la caja contenedora hasta cubrir por completo todos los posibles puntos de fuga (puertos de entrada o salida del contenedor); este nivel debe estar por lo menos 10 centímetros por encima del punto de fuga más alto.", "borrador": false}, {"n": "5", "ref": "5.6.2 h) iii) – paso 5", "texto": "Coloque una regla de medición dentro del agua.", "borrador": false}, {"n": "6", "ref": "5.6.2 h) iii) – paso 6", "texto": "Tome la medida inicial del nivel de agua.", "borrador": false}, {"n": "7", "ref": "5.6.2 h) iii) – paso 7", "texto": "Deje el contenedor quieto durante 1 hora.", "borrador": false}, {"n": "8", "ref": "5.6.2 h) iii) – paso 8", "texto": "Mida el nivel final de agua. Si el nivel al cabo de una hora ha bajado más de 4 mm, la prueba se considera fallida y el contenedor deberá ser reparado o reemplazado según sea el caso. Si el nivel no bajó o bajó menos de 4 mm la prueba se considera aprobada.", "borrador": false}, {"n": "9", "ref": "5.6.2 h) iii) – paso 9", "texto": "Disponga el agua de prueba de manera adecuada, ya que esta puede estar contaminada con combustible.", "borrador": false}], "campos": [{"k": "ident", "label": "Identificación (N.º de surtidor / lado / producto)", "tipo": "text", "req": true, "pers": true}, {"k": "colchon", "label": "Altura de agua sobre el punto de fuga más alto", "tipo": "num", "unit": "cm", "ref": "5.6.2 h) iii) – paso 4"}, {"k": "nivelIni", "label": "Nivel inicial de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 6"}, {"k": "t0", "label": "Inicio del reposo", "tipo": "dt", "ref": "paso 7"}, {"k": "t1", "label": "Lectura final", "tipo": "dt", "ref": "paso 8"}, {"k": "nivelFin", "label": "Nivel final de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 8"}, {"k": "limpio", "label": "Elemento inspeccionado y limpiado antes de la prueba", "tipo": "check", "req": true}, {"k": "puertos", "label": "Puertos de testeo del espacio intersticial sellados y botas bien instaladas", "tipo": "check", "req": true}, {"k": "fuga", "label": "Se observan burbujas, humedad u otro indicio de pérdida de agua", "tipo": "check", "neg": true}, {"k": "agua", "label": "Agua de prueba dispuesta adecuadamente (puede contener combustible)", "tipo": "check", "req": true}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ini", "label": "Caja limpia e inspeccionada (antes)", "req": true}, {"k": "lleno", "label": "Caja llena: agua ≥10 cm sobre el punto de fuga más alto", "req": true}, {"k": "r0", "label": "Nivel inicial de agua con la regla (lectura legible)", "req": true}, {"k": "r1", "label": "Nivel final de agua con la regla, 1 hora después", "req": true}, {"k": "fin", "label": "Estado final y disposición del agua de prueba", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reemplazar la caja (5.1 i) y 5.6.2 h)); el procedimiento admite «reparado o reemplazado según sea el caso». Repetir la prueba tras la corrección y registrar la intervención en la bitácora (5 d).", "notas": ["Las cajas nuevas deben cumplir UL 2447 o Kiwa BRL-K21006 (5.1 i).", "Debe existir procedimiento documentado y evidencia escrita y fotográfica (5.6.2 h)."]}, {"id": "cajas-bomba", "n": 2, "file": "2-estanqueidad-cajas-bombas-sumergibles", "prefijo": "ECB", "titulo": "Prueba de estanqueidad de cajas contenedoras de bombas sumergibles (caja de tanque / cheque de fondo)", "corto": "Estanqueidad de cajas de bombas sumergibles", "resumen": "Prueba hidrostática de 1 hora a la caja que aloja la bomba sumergible y las tuberías de succión.", "elemento": "Caja contenedora de bomba sumergible / caja de tanque", "elementos": "Cajas contenedoras de bombas sumergibles", "numeral": "5.6.2 h) iii)", "frecuencia": "Anual (por lo menos cada año)", "objeto": "Verificar la estanqueidad de la caja de contención de derrames del tanque (donde queda la bomba sumergible y las tuberías de succión) y de sus botas y sellos.", "normativa": [{"ref": "5.6.2 h)", "texto": "Se deberán realizar Pruebas de Estanqueidad a las cajas contenedoras de derrames de los equipos de medición, contenedor de boca de descarga (spill container) y cajas contenedoras de las bombas sumergibles. Esta prueba deberá hacerse por lo menos cada año. En caso de que alguno de estos elementos no pase la Prueba de Estanqueidad, deberá ser reemplazado. Para la realización de esta prueba se tendrá en cuenta el procedimiento descrito en la guía PEI/RP1200 (…). De esta prueba habrá un procedimiento documentado y se dejará evidencia escrita y fotográfica."}, {"ref": "5.3.1 h)", "texto": "Los tanques deberán contar con una caja de contención de derrames de tanque (caja de tanque) en la cual quedará contenida la bomba sumergible y tuberías de succión; debe impedir que ingrese agua del exterior y que salgan derrames de combustible. Las cajas existentes podrán continuar su uso solo si garantizan la estanqueidad definida en la prueba del literal h) iii) del numeral 5.6.2 o hasta el daño del mismo, momento en el cual deberán ser reparadas o reemplazadas. Las nuevas deben tener paredes planas para fijar las botas de la tubería y seguir la norma UL 2447."}, {"ref": "3.1 Prueba de estanqueidad", "texto": "PRUEBA DE ESTANQUEIDAD (3.1). Verificación que se realiza a las cajas contenedoras de bombas y/o cajas de equipos de medición para garantizar la estanqueidad de la misma y de los accesorios como botas o sellos pasa tubos instaladas en ella, con el fin de garantizar que el agua del subsuelo no entre a la caja o que, en caso de fuga, el combustible contenido en la caja no salga al subsuelo. Se realiza llenando la caja de líquido hasta la parte superior verificando el nivel inicial de líquido y luego de transcurrido un periodo de tiempo, se vuelve a verificar este nivel. La aprobación o rechazo de esta prueba depende de la diferencia entre el nivel inicial y final."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Aprobada si el nivel de agua no bajó o bajó 4 mm o menos tras 1 hora (5.6.2 h) iii), paso 8).", "params": [{"k": "descMax", "label": "Descenso máximo permitido", "unit": "mm", "v": 4, "ref": "5.6.2 h) iii), paso 8"}, {"k": "tiempoMin", "label": "Tiempo de reposo mínimo", "unit": "min", "v": 60, "ref": "5.6.2 h) iii), paso 7"}, {"k": "colchonMin", "label": "Agua sobre el punto de fuga más alto, mínimo", "unit": "cm", "v": 10, "ref": "5.6.2 h) iii), paso 4"}], "instrumentos": ["regla"], "eval": "descenso", "pasos": [{"n": "1", "ref": "5.6.2 h) iii) – paso 1", "texto": "Inspeccione y limpie la caja a probar.", "borrador": false}, {"n": "2", "ref": "5.6.2 h) iii) – paso 2", "texto": "Inspeccione visualmente cualquier punto de posible fuga; si es el caso, séllelo o repárelo.", "borrador": false}, {"n": "3", "ref": "5.6.2 h) iii) – paso 3", "texto": "Asegúrese de que los puertos de testeo del espacio intersticial de la tubería doble pared se encuentran sellados y que las botas están adecuadamente instaladas, con el fin de no introducir agua en dicho espacio.", "borrador": false}, {"n": "4", "ref": "5.6.2 h) iii) – paso 4", "texto": "Agregue agua a la caja contenedora hasta cubrir por completo todos los posibles puntos de fuga (puertos de entrada o salida del contenedor); este nivel debe estar por lo menos 10 centímetros por encima del punto de fuga más alto.", "borrador": false}, {"n": "5", "ref": "5.6.2 h) iii) – paso 5", "texto": "Coloque una regla de medición dentro del agua.", "borrador": false}, {"n": "6", "ref": "5.6.2 h) iii) – paso 6", "texto": "Tome la medida inicial del nivel de agua.", "borrador": false}, {"n": "7", "ref": "5.6.2 h) iii) – paso 7", "texto": "Deje el contenedor quieto durante 1 hora.", "borrador": false}, {"n": "8", "ref": "5.6.2 h) iii) – paso 8", "texto": "Mida el nivel final de agua. Si el nivel al cabo de una hora ha bajado más de 4 mm, la prueba se considera fallida y el contenedor deberá ser reparado o reemplazado según sea el caso. Si el nivel no bajó o bajó menos de 4 mm la prueba se considera aprobada.", "borrador": false}, {"n": "9", "ref": "5.6.2 h) iii) – paso 9", "texto": "Disponga el agua de prueba de manera adecuada, ya que esta puede estar contaminada con combustible.", "borrador": false}], "campos": [{"k": "ident", "label": "Identificación (N.º de surtidor / lado / producto)", "tipo": "text", "req": true, "pers": true}, {"k": "colchon", "label": "Altura de agua sobre el punto de fuga más alto", "tipo": "num", "unit": "cm", "ref": "5.6.2 h) iii) – paso 4"}, {"k": "nivelIni", "label": "Nivel inicial de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 6"}, {"k": "t0", "label": "Inicio del reposo", "tipo": "dt", "ref": "paso 7"}, {"k": "t1", "label": "Lectura final", "tipo": "dt", "ref": "paso 8"}, {"k": "nivelFin", "label": "Nivel final de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 8"}, {"k": "limpio", "label": "Elemento inspeccionado y limpiado antes de la prueba", "tipo": "check", "req": true}, {"k": "puertos", "label": "Puertos de testeo del espacio intersticial sellados y botas bien instaladas", "tipo": "check", "req": true}, {"k": "fuga", "label": "Se observan burbujas, humedad u otro indicio de pérdida de agua", "tipo": "check", "neg": true}, {"k": "agua", "label": "Agua de prueba dispuesta adecuadamente (puede contener combustible)", "tipo": "check", "req": true}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ini", "label": "Caja limpia e inspeccionada (antes)", "req": true}, {"k": "lleno", "label": "Caja llena: agua ≥10 cm sobre el punto de fuga más alto", "req": true}, {"k": "r0", "label": "Nivel inicial de agua con la regla (lectura legible)", "req": true}, {"k": "r1", "label": "Nivel final de agua con la regla, 1 hora después", "req": true}, {"k": "fin", "label": "Estado final y disposición del agua de prueba", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reparar o reemplazar la caja de tanque (5.3.1 h) y 5.6.2 h)). Repetir la prueba tras la corrección y registrar la intervención en la bitácora (5 d).", "notas": ["Al probar, los puertos de testeo del espacio intersticial de la tubería de doble pared deben estar sellados (paso 3).", "Debe existir procedimiento documentado y evidencia escrita y fotográfica (5.6.2 h)."]}, {"id": "spill-hidro", "n": 3, "file": "3-estanqueidad-spill-containers", "prefijo": "ESC", "titulo": "Prueba de estanqueidad de spill containers (contenedor de derrames, prueba hidrostática)", "corto": "Estanqueidad de spill containers", "resumen": "Prueba hidrostática de 1 hora al contenedor de derrames de la boca de descarga (pared sencilla).", "elemento": "Spill container (contenedor de derrames)", "elementos": "Spill containers", "numeral": "5.6.2 h) i)", "frecuencia": "Anual (por lo menos cada año)", "objeto": "Verificar la estanqueidad del contenedor de derrames de la boca de descarga de pared sencilla instalado antes de la entrada en vigencia. Los de doble pared se prueban por vacío (servicio 4).", "normativa": [{"ref": "5.6.2 h)", "texto": "Se deberán realizar Pruebas de Estanqueidad a las cajas contenedoras de derrames de los equipos de medición, contenedor de boca de descarga (spill container) y cajas contenedoras de las bombas sumergibles. Esta prueba deberá hacerse por lo menos cada año. En caso de que alguno de estos elementos no pase la Prueba de Estanqueidad, deberá ser reemplazado. Para la realización de esta prueba se tendrá en cuenta el procedimiento descrito en la guía PEI/RP1200 (…). De esta prueba habrá un procedimiento documentado y se dejará evidencia escrita y fotográfica."}, {"ref": "5.3.1 f) i)", "texto": "Los contenedores de derrames de pared simple instalados antes de la entrada en vigencia podrán continuar su uso siempre y cuando garanticen estanqueidad definida en la prueba del literal h) i) del numeral 5.6.2 o hasta el daño del mismo, momento en el cual deberán ser remplazados. No se podrán reparar. Los que se instalen después deben ser de doble contención, cumplir UL 2447 y contar con válvula de sobrellenado UL 2583."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Aprobado si el nivel de agua no bajó o bajó 4 mm o menos tras 1 hora (5.6.2 h) i), paso 6).", "params": [{"k": "descMax", "label": "Descenso máximo permitido", "unit": "mm", "v": 4, "ref": "5.6.2 h) i), paso 6"}, {"k": "tiempoMin", "label": "Tiempo de reposo mínimo", "unit": "min", "v": 60, "ref": "5.6.2 h) i), paso 4"}], "instrumentos": ["regla"], "eval": "descenso", "pasos": [{"n": "1", "ref": "5.6.2 h) i) – paso 1", "texto": "Limpie completamente el contenedor.", "borrador": false}, {"n": "2", "ref": "5.6.2 h) i) – paso 2", "texto": "Asegúrese de que la válvula del mismo se encuentra cerrada.", "borrador": false}, {"n": "3", "ref": "5.6.2 h) i) – paso 3", "texto": "Llene el contenedor de derrames con agua hasta la parte superior.", "borrador": false}, {"n": "4", "ref": "5.6.2 h) i) – paso 4", "texto": "Marque el nivel de agua y deje en reposo durante una hora.", "borrador": false}, {"n": "5", "ref": "5.6.2 h) i) – paso 5", "texto": "Mediante inspección visual, busque burbujas o cualquier otro indicio de pérdida de agua.", "borrador": false}, {"n": "6", "ref": "5.6.2 h) i) – paso 6", "texto": "Mida el nivel final de agua. Si el nivel al cabo de una hora ha bajado más de 4 mm, la prueba se considera fallida y el contenedor deberá ser reparado o reemplazado según sea el caso. Si el nivel no bajó o bajó menos de 4 mm la prueba se considera aprobada.", "borrador": false}, {"n": "7", "ref": "5.6.2 h) i) – paso 7", "texto": "Disponga el agua de prueba de manera adecuada, ya que esta puede estar contaminada con combustible.", "borrador": false}], "campos": [{"k": "ident", "label": "Spill container (tanque N.º, producto)", "tipo": "text", "req": true, "pers": true}, {"k": "nivelIni", "label": "Nivel inicial de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 4"}, {"k": "t0", "label": "Inicio del reposo", "tipo": "dt", "ref": "paso 4"}, {"k": "t1", "label": "Lectura final", "tipo": "dt", "ref": "paso 6"}, {"k": "nivelFin", "label": "Nivel final de agua (lectura en la regla)", "tipo": "num", "unit": "mm", "ref": "paso 6"}, {"k": "limpio", "label": "Elemento inspeccionado y limpiado antes de la prueba", "tipo": "check", "req": true}, {"k": "valvula", "label": "Válvula de drenaje cerrada", "tipo": "check", "req": true}, {"k": "lleno", "label": "Contenedor lleno de agua hasta la parte superior", "tipo": "check", "req": true}, {"k": "fuga", "label": "Se observan burbujas, humedad u otro indicio de pérdida de agua", "tipo": "check", "neg": true}, {"k": "agua", "label": "Agua de prueba dispuesta adecuadamente (puede contener combustible)", "tipo": "check", "req": true}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ini", "label": "Contenedor limpio e inspeccionado (antes)", "req": true}, {"k": "lleno", "label": "Contenedor lleno hasta la parte superior, válvula cerrada", "req": true}, {"k": "r0", "label": "Nivel inicial de agua con la regla (lectura legible)", "req": true}, {"k": "r1", "label": "Nivel final de agua con la regla, 1 hora después", "req": true}, {"k": "fin", "label": "Estado final y disposición del agua de prueba", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reemplazar el spill container de pared sencilla: no se podrán reparar (5.3.1 f) i)). Repetir la prueba y registrar en la bitácora (5 d).", "notas": ["Para pared sencilla el procedimiento dice «reparado o reemplazado según sea el caso», pero 5.3.1 f) i) prohíbe repararlos: se exige reemplazo.", "Debe existir procedimiento documentado y evidencia escrita y fotográfica (5.6.2 h)."]}, {"id": "spill-vacio", "n": 4, "file": "4-prueba-vacio-spill-containers", "prefijo": "PVS", "titulo": "Prueba de vacío a spill containers (doble pared)", "corto": "Prueba de vacío a spill containers", "resumen": "Vacío de 380 mm de agua en el espacio intersticial; debe mantenerse por encima de 305 mm tras 5 minutos.", "elemento": "Spill container de doble pared", "elementos": "Spill containers de doble pared", "numeral": "5.6.2 h) ii)", "frecuencia": "Anual (por lo menos cada año)", "objeto": "Verificar la hermeticidad del espacio intersticial de los contenedores de derrames de doble pared mediante vacío.", "normativa": [{"ref": "5.6.2 h)", "texto": "Se deberán realizar Pruebas de Estanqueidad a las cajas contenedoras de derrames de los equipos de medición, contenedor de boca de descarga (spill container) y cajas contenedoras de las bombas sumergibles. Esta prueba deberá hacerse por lo menos cada año. En caso de que alguno de estos elementos no pase la Prueba de Estanqueidad, deberá ser reemplazado. Para la realización de esta prueba se tendrá en cuenta el procedimiento descrito en la guía PEI/RP1200 (…). De esta prueba habrá un procedimiento documentado y se dejará evidencia escrita y fotográfica."}, {"ref": "5.3.1 f) i)", "texto": "El contenedor de derrames deberá ser de doble contención y contar con una válvula de drenaje. El espacio anular entre el contenedor primario y el secundario deberá estar herméticamente sellado. El contenedor secundario deberá contar con un mecanismo para detectar presencia de líquido en su interior. Los de doble pared instalados antes de la entrada en vigencia podrán continuar su uso solo si garantizan la estanqueidad definida en la prueba del literal h) ii) del numeral 5.6.2 o hasta el daño del mismo, momento en el cual deberán ser reparados o remplazados."}, {"ref": "3.1 Contenedor de derrames de doble contención", "texto": "Balde resistente a combustibles, hermético, de fibra de vidrio o polietileno de alta densidad, con capacidad mínima de 18 litros (contenedor primario) contenido dentro de otro balde (secundario); entre ambos hay un espacio intersticial sellado que puede medirse mediante aplicación de presión o vacío para garantizar su hermeticidad."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Aprobado si, tras estabilizar el vacío en 380 mm de agua y dejarlo 5 minutos, se mantiene por encima de 305 mm de agua (5.6.2 h) ii), paso 5).", "params": [{"k": "vacioObj", "label": "Vacío a generar y estabilizar", "unit": "mm de agua", "v": 380, "ref": "5.6.2 h) ii), pasos 2 y 3"}, {"k": "espera", "label": "Espera antes de re-estabilizar", "unit": "s", "v": 30, "ref": "5.6.2 h) ii), paso 3"}, {"k": "vacioMin", "label": "Vacío mínimo tras el reposo", "unit": "mm de agua", "v": 305, "ref": "5.6.2 h) ii), paso 5"}, {"k": "tiempoMin", "label": "Reposo", "unit": "min", "v": 5, "ref": "5.6.2 h) ii), paso 4"}], "instrumentos": ["vacuometro"], "eval": "vacio", "pasos": [{"n": "1", "ref": "5.6.2 h) ii) – paso 1", "texto": "Conecte el equipo generador de vacío al puerto de prueba del espacio intersticial del contenedor de derrames.", "borrador": false}, {"n": "2", "ref": "5.6.2 h) ii) – paso 2", "texto": "Genere un vacío de 380 mm de agua (15 pulgadas de agua).", "borrador": false}, {"n": "3", "ref": "5.6.2 h) ii) – paso 3", "texto": "Espere 30 segundos y vuelva a estabilizar el vacío en 380 mm de agua.", "borrador": false}, {"n": "4", "ref": "5.6.2 h) ii) – paso 4", "texto": "Deje el contenedor quieto durante 5 minutos.", "borrador": false}, {"n": "5", "ref": "5.6.2 h) ii) – paso 5", "texto": "Revise nuevamente el vacío; si este se mantiene por encima de 305 mm de agua (12 pulgadas de agua) la prueba está aprobada. Si el espacio no mantiene el vacío o la presión de vacío es inferior a 305 mm de agua, la prueba es rechazada y el contenedor deberá ser reparado o reemplazado según sea el caso.", "borrador": false}], "campos": [{"k": "ident", "label": "Spill container (tanque N.º, producto)", "tipo": "text", "req": true, "pers": true}, {"k": "conectado", "label": "Equipo generador de vacío conectado al puerto de prueba del espacio intersticial", "tipo": "check", "req": true, "ref": "paso 1"}, {"k": "vacioEst", "label": "Vacío estabilizado después de 30 s", "tipo": "num", "unit": "mm de agua", "ref": "pasos 2 y 3"}, {"k": "t0", "label": "Inicio del reposo de 5 min", "tipo": "dt", "ref": "paso 4"}, {"k": "t1", "label": "Lectura final", "tipo": "dt", "ref": "paso 5"}, {"k": "vacioFin", "label": "Vacío leído tras el reposo", "tipo": "num", "unit": "mm de agua", "ref": "paso 5"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ident", "label": "Spill container identificado (puerto de prueba del espacio intersticial visible)", "req": true}, {"k": "equipo", "label": "Equipo generador de vacío conectado al puerto", "req": true}, {"k": "v0", "label": "Lectura del vacío estabilizado en 380 mm de agua", "req": true}, {"k": "v1", "label": "Lectura del vacío tras 5 minutos", "req": true}, {"k": "fin", "label": "Estado final del contenedor", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "Reparar o reemplazar el spill container (5.6.2 h) ii), paso 5; 5.3.1 f) i)). Repetir la prueba y registrar en la bitácora (5 d).", "notas": ["380 mm de agua = 15 pulgadas de agua; 305 mm = 12 pulgadas.", "Debe existir procedimiento documentado y evidencia escrita y fotográfica (5.6.2 h)."]}, {"id": "sobrellenado", "n": 5, "file": "5-prueba-dispositivos-sobrellenado", "prefijo": "PDS", "titulo": "Prueba de dispositivos de sobrellenado", "corto": "Dispositivos de sobrellenado", "resumen": "Inspección y prueba anual de la válvula o sistema de prevención de sobrellenado de cada tanque.", "elemento": "Dispositivo de sobrellenado (por tanque)", "elementos": "Dispositivos de sobrellenado", "numeral": "5.6.2 g)", "frecuencia": "Anual (como mínimo una vez al año)", "objeto": "Comprobar que cada tanque tiene un mecanismo de prevención de sobrellenado operativo, con cierre automático hasta el 95 % de la capacidad, y que existe el procedimiento documentado de inspección y prueba.", "normativa": [{"ref": "5.6.2 g)", "texto": "Se debe tener un procedimiento documentado para la inspección y prueba de los dispositivos o sistemas de sobrellenado. Se deben probar como mínimo una vez al año."}, {"ref": "5.3 b)", "texto": "Todo Tanque de Almacenamiento debe contar con un mecanismo para la prevención de sobrellenado (plazo de tres años desde la vigencia). Los tanques subterráneos instalados a partir de la vigencia deberán contar con válvula de sobrellenado hermética a vapores, inspeccionable en el tubo de descarga, con cierre automático al paso del combustible, norma UL 2583 o sucesoras. El cierre de esta válvula deberá graduarse a un nivel máximo de 95 % de la capacidad del tanque. El tubo de llenado o «riser» debe instalarse en el contenedor de derrames y finalizar en el lomo del tanque; la válvula conduce el combustible hasta el fondo."}, {"ref": "5.3.2 l)", "texto": "Todos los tanques superficiales deben contar con ventilación adecuada (…). Para el efecto se debe instalar una válvula de prevención de derrames que cierre automáticamente el flujo de combustible."}, {"ref": "5.3.1 f) i)", "texto": "Los contenedores de derrames que se instalen deben cumplir la norma UL 2447 y contar con válvula de sobrellenado en el tubo de descarga que cumpla la norma UL 2583."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si el dispositivo existe, es inspeccionable, cierra automáticamente al nivel graduado y este es de 95 % o menos de la capacidad del tanque; en dispositivos instalados desde la vigencia, con certificación UL 2583.", "params": [{"k": "cierreMax", "label": "Nivel máximo de cierre", "unit": "% de la capacidad", "v": 95, "ref": "5.3 b)"}], "instrumentos": [], "eval": "sobrellenado", "pasos": [{"n": "1", "ref": "5.6.2 g)", "texto": "Verifique que existe el procedimiento documentado de inspección y prueba de los dispositivos de sobrellenado y que la bitácora de mantenimiento está disponible en la estación (5 d).", "borrador": false}, {"n": "2", "ref": "5.3 c)", "texto": "Identifique el tanque: número, producto almacenado y capacidad de operación, según la tabla de aforo.", "borrador": false}, {"n": "3", "ref": "5.3 b)", "texto": "Inspeccione el dispositivo: válvula de sobrellenado hermética a vapores, inspeccionable, en el tubo de descarga, con cierre automático al paso del combustible; en instalaciones desde la vigencia, certificación UL 2583.", "borrador": false}, {"n": "4", "ref": "5.3 b)", "texto": "Verifique que el tubo de llenado (riser) está dentro del contenedor de derrames y termina en el lomo del tanque, y que la válvula conduce el combustible hasta el fondo.", "borrador": false}, {"n": "5", "ref": "5.3 b)", "texto": "Verifique que el cierre está graduado a un nivel máximo del 95 % de la capacidad del tanque.", "borrador": false}, {"n": "6", "ref": "5.6.2 g)", "texto": "Prueba funcional: según las instrucciones del fabricante y las prácticas de la guía PEI/RP1200 (citada en 5.6.2 h), accione el flotador o el mecanismo de cierre, o simule el nivel de cierre, y compruebe que el flujo se interrumpe automáticamente. No genere un derrame de combustible.", "borrador": false}, {"n": "7", "ref": "5.6.2 g)", "texto": "Verifique que no hay fugas ni rebose en el contenedor de derrames durante la prueba, restablezca el dispositivo a su condición normal y confirme que el tanque queda en servicio seguro.", "borrador": false}, {"n": "8", "ref": "5 d) · 5.6.2", "texto": "Registre el resultado en la bitácora y conserve la evidencia escrita y fotográfica.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque (N.º, producto, compartimiento)", "tipo": "text", "req": true, "pers": true}, {"k": "capacidad", "label": "Capacidad de operación del tanque", "tipo": "num", "unit": "L", "ref": "paso 2"}, {"k": "tipoDisp", "label": "Tipo de dispositivo", "tipo": "select", "opts": ["Válvula de sobrellenado en el tubo de descarga", "Válvula de prevención de derrames (tanque superficial)", "Otro mecanismo de prevención"], "req": true, "ref": "paso 3"}, {"k": "nuevo", "label": "Dispositivo instalado a partir de la entrada en vigencia (30-mar-2022)", "tipo": "check"}, {"k": "procDoc", "label": "Existe procedimiento documentado de inspección y prueba", "tipo": "check", "req": true, "ref": "paso 1"}, {"k": "inspeccionable", "label": "Dispositivo inspeccionable", "tipo": "check", "req": true, "ref": "paso 3"}, {"k": "hermetica", "label": "Hermético a vapores", "tipo": "check", "req": true, "ref": "paso 3"}, {"k": "cert", "label": "Certificación UL 2583 (obligatoria si es nuevo)", "tipo": "check", "ref": "paso 3"}, {"k": "riser", "label": "Riser dentro del contenedor de derrames y finaliza en el lomo del tanque (subterráneos)", "tipo": "check", "req": true, "ref": "paso 4"}, {"k": "cierrePct", "label": "Nivel de cierre graduado", "tipo": "num", "unit": "% de la capacidad", "ref": "paso 5"}, {"k": "cierreAuto", "label": "En la prueba funcional el flujo se interrumpió automáticamente", "tipo": "check", "req": true, "ref": "paso 6"}, {"k": "sinFuga", "label": "Sin fugas ni rebose durante la prueba; dispositivo restablecido", "tipo": "check", "req": true, "ref": "paso 7"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ident", "label": "Tanque y punto de descarga identificados (número, producto)", "req": true}, {"k": "disp", "label": "Dispositivo instalado en el tubo de descarga (placa o certificación visible)", "req": true}, {"k": "ajuste", "label": "Ajuste del nivel de cierre (≤95 %)", "req": true}, {"k": "prueba", "label": "Prueba funcional: cierre del flujo", "req": true}, {"k": "fin", "label": "Contenedor de derrames sin fugas y estado final", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "La resolución no fija la acción correctiva para este caso: corregir o reemplazar el dispositivo según el fabricante, repetir la prueba y registrarlo en la bitácora (5 d).", "notas": ["Pasos auxiliares y parámetros validados por el responsable técnico de TruckServices SAS.", "Los pasos 1 a 5 y 8 se apoyan en los numerales indicados."]}, {"id": "conductividad", "n": 6, "file": "6-verificacion-conductividad-tierra-mangueras", "prefijo": "VCT", "titulo": "Verificación de conductividad a tierra de mangueras de medidores", "corto": "Conductividad a tierra de mangueras", "resumen": "Medición de la resistencia a tierra desde la punta de la pistola hasta el equipo; máximo 5 Ω.", "elemento": "Manguera de medidor", "elementos": "Mangueras de medidores", "numeral": "5.6.2 c)", "frecuencia": "Anual (por lo menos cada año)", "objeto": "Verificar que los accesorios conectados al medidor (pistola, swivel, manguera) garantizan la conductividad de la señal de tierra.", "normativa": [{"ref": "5.6.2 c)", "texto": "Verificar que los accesorios conectados al Medidor de Combustible garanticen la conductividad de la señal de tierra no mayor a «5 A + 10 %» desde la punta de la pistola hasta el equipo, por lo menos cada año. (El texto escaneado dice «A»; se aplica 5 Ω por decisión del responsable, a confirmar contra el original.)"}, {"ref": "5.1 g)", "texto": "Las mangueras serán resistentes a combustibles, con alma de acero que aseguren que la conexión a tierra sea firme, no deben tener empalmes, y deberán contar con un destorcedor (swivel) que permita a la pistola adecuarse a la posición de carga."}, {"ref": "5.1 c)", "texto": "El equipo de medición deberá estar anclado según las recomendaciones del fabricante y contar con una instalación que asegure la descarga efectiva de la energía estática. Todo equipo metálico donde pudiera estar presente o fluir una mezcla inflamable debe conectarse a tierra."}, {"ref": "3.1 Áreas clasificadas", "texto": "El espacio dentro del encerramiento del surtidor y los equipos eléctricos integrados en la manguera son lugar Clase I, División 1."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si la resistencia es de 5 Ω o menos; hasta 5,5 Ω se acepta con la tolerancia de 10 %; por encima, no conforme.", "params": [{"k": "limite", "label": "Resistencia máxima", "unit": "Ω", "v": 5, "ref": "5.6.2 c)"}, {"k": "tol", "label": "Tolerancia", "unit": "%", "v": 10, "ref": "5.6.2 c)"}], "instrumentos": ["ohmimetro"], "eval": "tierra", "pasos": [{"n": "1", "ref": "5 d)", "texto": "Identifique el medidor, la manguera y el producto.", "borrador": false}, {"n": "2", "ref": "5.1 g)", "texto": "Verifique visualmente que la manguera tiene alma de acero, no tiene empalmes y cuenta con swivel, y que no hay pintura, suciedad o sellante aislante en los puntos de contacto.", "borrador": false}, {"n": "3", "ref": "3.1", "texto": "Seguridad: el interior del surtidor es lugar Clase I División 1. Use instrumento apto para áreas clasificadas (intrínsecamente seguro) o haga la prueba con el permiso de trabajo y las condiciones de seguridad de la estación.", "borrador": false}, {"n": "4", "ref": "5.6.2 c)", "texto": "Mida la resistencia entre la punta metálica de la pistola y el equipo (chasis o punto de puesta a tierra del medidor), con la manguera extendida.", "borrador": false}, {"n": "5", "ref": "5.6.2 c)", "texto": "Compare con el límite: 5 Ω como máximo, con tolerancia de 10 %.", "borrador": false}, {"n": "6", "ref": "5.1 c)", "texto": "Si el valor es inestable o alto, revise swivel, breakaway, acoples y la conexión a tierra del equipo, y repita la medición.", "borrador": false}, {"n": "7", "ref": "5 d)", "texto": "Registre el valor y el resultado en la bitácora y conserve la evidencia escrita y fotográfica.", "borrador": false}], "campos": [{"k": "ident", "label": "Medidor y manguera (surtidor N.º, lado, producto)", "tipo": "text", "req": true, "pers": true}, {"k": "alma", "label": "Manguera con alma de acero, sin empalmes, con swivel", "tipo": "check", "req": true, "ref": "paso 2"}, {"k": "contacto", "label": "Puntos de contacto limpios, sin pintura ni sellante aislante", "tipo": "check", "req": true, "ref": "paso 2"}, {"k": "seguridad", "label": "Instrumento apto para área clasificada o permiso de trabajo vigente", "tipo": "check", "req": true, "ref": "paso 3"}, {"k": "resistencia", "label": "Resistencia medida (punta de la pistola – equipo)", "tipo": "num", "unit": "Ω", "ref": "paso 4"}, {"k": "nota", "label": "Observaciones del intento", "tipo": "area"}], "fotos": [{"k": "ident", "label": "Medidor, manguera y pistola identificados", "req": true}, {"k": "montaje", "label": "Instrumento conectado: una punta en la boquilla de la pistola y otra en el equipo", "req": true}, {"k": "lectura", "label": "Lectura del instrumento (Ω) legible", "req": true}, {"k": "tierra", "label": "Conexión a tierra del equipo y estado del swivel/breakaway", "req": true}], "fotosGen": [{"k": "sitio", "label": "Vista general del sitio de la prueba (estación, isla, tanque)", "req": true}, {"k": "instr", "label": "Instrumentos usados, con su certificado de calibración visible", "req": true}], "accionNC": "La resolución no fija la acción: corregir la continuidad (cambiar manguera, swivel o conexión a tierra, 5.1 c) y g)), repetir la medición y registrarlo en la bitácora (5 d).", "notas": ["Texto original dice «5 A ±10 %»: se adoptó 5 Ω; confirmar contra el original antes de emitir el informe.", "Pasos auxiliares y parámetros validados por el responsable técnico de TruckServices SAS."]}, {"id": "desfogue", "n": 7, "file": "7-verificacion-tuberia-desfogue", "prefijo": "VTD", "titulo": "Verificación del estado de la tubería de desfogue", "corto": "Tubería de desfogue (venteo)", "resumen": "Verificación bienal del estado y funcionamiento de los tubos de respiración de cada tanque.", "elemento": "Tubería de desfogue (por tanque o compartimiento)", "elementos": "Tuberías de desfogue", "numeral": "5.6.2 s)", "frecuencia": "Cada 2 años (por lo menos)", "objeto": "Verificar el estado y funcionamiento de la tubería de desfogue (respiración o venteo) de cada tanque o compartimiento y su conformidad dimensional.", "normativa": [{"ref": "5.6.2 s)", "texto": "Verificar el estado y funcionamiento de la tubería de desfogue, por lo menos cada dos (2) años. Se deberá dejar evidencia escrita de este procedimiento."}, {"ref": "5.3 e)", "texto": "En los tanques subterráneos deberán existir tubos de respiración o venteo por tanque/compartimiento. Las bocas salen al aire libre, por encima de tejados, placas o planchas mínimo 1,5 m + 10 % y alejadas de conducciones eléctricas a mínimo 3 m + 10 %. Cuando se almacenen líquidos clase I, las tuberías de venteo deberán contar con válvula de presión vacío (rango 2,5\" a 6\" de columna de agua para presión y 6\" a 10\" para vacío, avalado por el fabricante; UL 2583 si se instala desde la vigencia). Las tuberías de venteo deben estar a no menos de 3,6 m por encima del nivel del suelo y a no más de 7 m + 10 % por encima de los tanques, identificadas, donde los vapores no se acumulen, a mínimo 3 m de las aberturas de cualquier edificio. La tubería enterrada de desfogue de instalaciones nuevas tendrá pendiente mínima de 1 % hacia los tanques."}, {"ref": "5.3 f)", "texto": "El diámetro del tubo de respiración (desfogue) no podrá ser menor a ½ [texto escaneado: «%%»] del diámetro de la boca de llenado, pero en ningún caso inferior a treinta y dos (32) mm (1,25 pulgadas)."}, {"ref": "5.3.2 l)", "texto": "Tanques superficiales: ventilación adecuada; en tanques de gasolina, válvula de presión vacío en cada respiradero; en tanques de diésel, un elemento que permita la salida de vapores, la entrada de aire y evite el ingreso de agua o partículas."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si el tubo está en buen estado y libre, identificado, cumple diámetros, alturas y distancias, y (líquidos clase I) cuenta con válvula de presión-vacío.", "params": [{"k": "diamMin", "label": "Diámetro mínimo del tubo", "unit": "mm", "v": 32, "ref": "5.3 f)"}, {"k": "fracBoca", "label": "Fracción mínima del diámetro de la boca de llenado", "unit": "(0,5 = ½)", "v": 0.5, "ref": "5.3 f) (OCR: «%%»; verificar)"}, {"k": "altTecho", "label": "Altura mínima sobre tejados, placas o planchas", "unit": "m", "v": 1.5, "ref": "5.3 e)"}, {"k": "distElec", "label": "Distancia mínima a conducciones eléctricas", "unit": "m", "v": 3, "ref": "5.3 e)"}, {"k": "altSuelo", "label": "Altura mínima sobre el nivel del suelo", "unit": "m", "v": 3.6, "ref": "5.3 e)"}, {"k": "altTanqueMax", "label": "Altura máxima sobre los tanques", "unit": "m", "v": 7, "ref": "5.3 e)"}, {"k": "distAbert", "label": "Distancia mínima a aberturas de edificios", "unit": "m", "v": 3, "ref": "5.3 e)"}], "instrumentos": ["cinta"], "eval": "desfogue", "pasos": [{"n": "1", "ref": "5.3 e)", "texto": "Identifique el tanque o compartimiento y su tubería de desfogue (debe existir una por tanque/compartimiento y estar identificada).", "borrador": false}, {"n": "2", "ref": "5.6.2 s)", "texto": "Inspeccione el estado: corrosión, abolladuras, soportes, uniones y remate del tubo.", "borrador": false}, {"n": "3", "ref": "5.3 f)", "texto": "Mida el diámetro del tubo y compárelo con la boca de llenado: no menor a la fracción indicada y en ningún caso inferior a 32 mm.", "borrador": false}, {"n": "4", "ref": "5.3 e)", "texto": "Mida las alturas: mínimo 3,6 m sobre el nivel del suelo, máximo 7 m sobre los tanques y mínimo 1,5 m sobre tejados, placas o planchas.", "borrador": false}, {"n": "5", "ref": "5.3 e)", "texto": "Mida las distancias: mínimo 3 m a conducciones eléctricas y mínimo 3 m a las aberturas de cualquier edificio; verifique que los vapores no se acumulan ni quedan atrapados bajo aleros.", "borrador": false}, {"n": "6", "ref": "5.3 e) · 5.3.2 l)", "texto": "Líquidos clase I (gasolina): verifique la válvula de presión-vacío (2,5\"–6\" presión; 6\"–10\" vacío, aval del fabricante; UL 2583 si es posterior a la vigencia). Diésel en superficie: elemento de salida de vapores y entrada de aire que evite ingreso de agua o partículas.", "borrador": false}, {"n": "7", "ref": "5.3 e)", "texto": "Tubería enterrada de instalaciones nuevas, modificadas o ampliadas: pendiente mínima de 1 % hacia el tanque.", "borrador": false}, {"n": "8", "ref": "5.6.2 s)", "texto": "Compruebe el funcionamiento: paso libre sin obstrucciones (por ejemplo, prueba de paso de aire o inspección del remate).", "borrador": false}, {"n": "9", "ref": "5.6.2 s)", "texto": "Deje evidencia escrita del procedimiento y registre en la bitácora.", "borrador": false}], "campos": [{"k": "ident", "label": "Tanque o compartimiento y producto", "tipo": "text", "req": true, "pers": true}, {"k": "clase1", "label": "Almacena líquido clase I (gasolina, etanol)", "tipo": "check"}, {"k": "superficie", "label":  mensual de las instalaciones eléctricas de la estación y de las condiciones de los conductos, sellos y cajas en áreas clasificadas.", "ejecutor": "La resolución no restringe la inspección visual; las correcciones eléctricas deben hacerlas profesionales competentes conforme al RETIE (4.3).", "normativa": [{"ref": "5.6.2 f)", "texto": "Realizar una inspección visual de las Instalaciones Eléctricas, cuadros de mando y maniobra, protecciones, instrumentos de medida, circuitos de alumbrado y fuerza motriz. Se deberá revisar que todos los cables (potencia y datos) se encuentran entubados en un conducto resistente al combustible, deben contar con sellos cortafuego, las cajas deberán ser antiexplosión, por lo menos cada mes."}, {"ref": "4.3", "texto": "Las instalaciones deben cumplir el RETIE vigente; las construidas antes del 30-ago-2013 requieren declaración de cumplimiento cada 5 años."}, {"ref": "5.6.2 (encabezado)", "texto": "5.6.2. Pruebas periódicas, enmarcadas en un programa de inspección y mantenimiento con evidencia escrita de cada actividad consignada en la bitácora de la estación."}, {"ref": "5 d)", "texto": "5 d. Las Estaciones de Servicio deberán contar con una bitácora de mantenimiento de los equipos (…) donde se registrará el equipo intervenido, la fecha, la tarea realizada y el nombre de la empresa o persona encargada."}], "criterio": "Conforme si no se encuentran deficiencias visibles y los cables están entubados en conducto resistente al combustible, con sellos cortafuego y cajas antiexplosión.", "params": [], "instrumentos": [], "eval": "lista", "pasos": [{"n": "1", "ref": "5.6.2 f)", "texto": "Inspeccione visualmente cuadros de mando y maniobra, protecciones, instrumentos de medida y circuitos de alumbrado y fuerza motriz.", "borrador": false}, {"n": "2", "ref": "5.6.2 f)", "texto": "Revise que todos los cables de potencia y de datos estén entubados en conducto resistente al combustible.", "borrador": false}, {"n": "3", "ref": "5.6.2 f)", "texto": "Ver
